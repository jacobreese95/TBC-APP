name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare token secret exists
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is missing or empty."
            echo "Add it at: Repo Settings → Secrets and variables → Actions"
            echo "Create a token at: https://dash.cloudflare.com/profile/api-tokens"
            echo "Use template: Edit Cloudflare Workers"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: TBC-APP
          command: deploy
