<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room - TBC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #messageInput { height: 48px; font-size: 1rem; }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="#" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank'); toggleMenu(); return false;">View Location on Google Maps</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <header><h1 id="roomTitle">Chat</h1></header>
    <div class="container" id="chatContainer" style="display:none; flex-direction:column; height:70vh;">
        <div id="messages" style="flex:1; overflow-y:auto; border:1px solid #ccc; padding:10px; margin-bottom:10px; border-radius:8px; background:#fff;"></div>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; gap:8px; align-items:center;">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button class="menu-btn" onclick="sendMessage()">Send</button>
            </div>
            <button class="menu-btn" id="prayerBtn" onclick="togglePrayer()" style="background:#7a8fac; width:100%;">🙏 Prayer Request</button>
            <p id="prayerHint" style="color:#8845a5; font-size:0.85rem; margin:0; display:none;">This message will be marked as a prayer request</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
      function toggleMenu() {
        document.getElementById('navDrawer').classList.toggle('open');
        document.getElementById('navOverlay').classList.toggle('open');
      }

      function getRoomFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('room');
      }

      let currentRoom = getRoomFromURL() || localStorage.getItem('currentChatRoom') || 'Whole Church';
      localStorage.setItem('currentChatRoom', currentRoom);

      let isPrayer = false;
      let unsubscribe = null;

      document.getElementById('roomTitle').textContent = currentRoom;

      requireApprovedUser().then(function(profile) {
        if (!profile) return;
        document.getElementById('chatContainer').style.display = 'flex;
        loadMessages();
      });

      function togglePrayer() {
        isPrayer = !isPrayer;
        const btn = document.getElementById('prayerBtn');
        const hint = document.getElementById('prayerHint');
        if (isPrayer) {
          btn.style.background = '#8845a5';
          btn.innerHTML = '🙏 Prayer ✓';
          hint.style.display = 'block';
        } else {
          btn.style.background = '#7a8fac';
          btn.innerHTML = '🙏 Prayer';
          hint.style.display = 'none';
        }
      }

      function loadMessages() {
        const container = document.getElementById('messages');
        const roomRef = db.collection('chats').doc(currentRoom).collection('messages');

        if (unsubscribe) unsubscribe();

        unsubscribe = roomRef.orderBy('timestamp').onSnapshot(snapshot => {
          container.innerHTML = '';
          snapshot.forEach(doc => {
            const msg = doc.data();
            const div = document.createElement('div');
            div.style.marginBottom = '12px';
            div.style.padding = '8px 12px';
            div.style.borderRadius = '12px';
            div.style.maxWidth = '80%';
            if (msg.isPrayer) {
              div.style.background = '#f5e6ff';
              div.style.border = '1px solid #ac8ce6';
              div.innerHTML = `<strong>${msg.name || 'Member'}</strong><br>${msg.text}<br><span style="color:#8845a5; font-size:0.8rem;">🙏 Prayer Request</span>`;
            } else {
              div.style.background = msg.uid === auth.currentUser.uid ? '#d4f0f0' : '#f0f0f0';
              div.innerHTML = `<strong>${msg.name || 'Member'}</strong><br>${msg.text}`;
            }
            container.appendChild(div);
          });
          container.scrollTop = container.scrollHeight;
        });
      }

      async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const user = auth.currentUser;
        const profile = await getUserProfile(user.uid);

        await db.collection('chats').doc(currentRoom).collection('messages').add({
          text,
          uid: user.uid,
          name: profile ? profile.name : (user.email || 'Member'),
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          isPrayer: currentRoom === 'Whole Church' ? isPrayer : false
        });

        input.value = '';
        if (isPrayer) togglePrayer();
      }
    </script>
</body>
</html>
