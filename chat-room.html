<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<link rel="stylesheet" href="style.css">
<style>
  .chat-container { display: flex; flex-direction: column; height: 100vh; }
  .week-header { padding: 8px 12px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
  .week-header h4 { margin: 0 0 6px 0; font-size: 14px; color: #404040; }
  .week-days { display: flex; gap: 6px; overflow-x: auto; }
  .week-day { flex: 1; min-width: 48px; text-align: center; padding: 6px 4px; background: white; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .week-day.has-event { background: #e8f4f8; border-color: #4cb8b9; }
  .week-day .day-name { font-weight: 600; color: #404040; }
  .week-day .day-num { font-size: 16px; font-weight: 700; color: #4cb8b9; }
  .messages { flex: 1; overflow-y: auto; padding: 10px; }
  .composer { display: flex; flex-direction: column; padding: 10px; border-top: 1px solid #ccc; }
  .composer-row { display: flex; gap: 8px; }
  .message-input { flex: 1; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .send-btn { height: 48px; padding: 0 20px; background: linear-gradient(135deg, #4cb8b9 0%, #7bafdd 55%, #b0dc77 100%); color: white; border: none; border-radius: 8px; font-size: 16px; }
  .prayer-btn { height: 40px; margin-top: 8px; background: #8845a5; color: white; border: none; border-radius: 8px; font-size: 14px; }
  .prayer-btn.active { background: #ac8ce6; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="week-header" id="weekHeader" style="display:none;">
    <h4>📅 This Week — tap to open calendar</h4>
    <div class="week-days" id="weekDays"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <div class="composer-row">
      <input type="text" id="messageInput" class="message-input" placeholder="Type a message...">
      <button id="sendBtn" class="send-btn">Send</button>
    </div>
    <button id="prayerBtn" class="prayer-btn">🙏 Prayer Request</button>
  </div>
</div>
<script src="app.js"></script>
<script src="auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Firebase config (same as auth.js)
const firebaseConfig = {
  apiKey: "AIzaSyChN8xvRz0R2Zo6NUEeHRBHib2XoxVb4nE",
  authDomain: "tbc-app-60125.firebaseapp.com",
  projectId: "tbc-app-60125",
  storageBucket: "tbc-app-60125.firebasestorage.app",
  messagingSenderId: "813699285807",
  appId: "1:813699285807:web:50216bcc58355a49ca97da"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Get room from URL
let currentRoom = new URLSearchParams(window.location.search).get('room') || 'Whole Church';

// Week view header
async function loadWeekView() {
  const header = document.getElementById('weekHeader');
  const daysContainer = document.getElementById('weekDays');
  if (!header || !daysContainer) return;

  header.style.display = 'block';
  daysContainer.innerHTML = '';

  const today = new Date();
  const startOfWeek = new Date(today);
  startOfWeek.setDate(today.getDate() - today.getDay()); // Sunday

  const ministry = currentRoom === 'Whole Church' ? null : currentRoom;

  for (let i = 0; i < 7; i++) {
    const day = new Date(startOfWeek);
    day.setDate(startOfWeek.getDate() + i);

    const dayEl = document.createElement('div');
    dayEl.className = 'week-day';
    dayEl.innerHTML = `
      <div class="day-name">${day.toLocaleDateString('en-US', { weekday: 'short' })}</div>
      <div class="day-num">${day.getDate()}</div>
    `;

    // Check for events this day
    const dayStart = new Date(day); dayStart.setHours(0,0,0,0);
    const dayEnd = new Date(day); dayEnd.setHours(23,59,59,999);

    let q = db.collection('events')
      .where('date', '>=', dayStart.toISOString().split('T')[0])
      .where('date', '<=', dayEnd.toISOString().split('T')[0]);
    if (ministry) q = q.where('ministry', '==', ministry);

    const snap = await q.get();
    if (!snap.empty) dayEl.classList.add('has-event');

    dayEl.onclick = () => window.location.href = 'calendar.html';
    daysContainer.appendChild(dayEl);
  }
}

// Load week view on start
loadWeekView();

// Existing chat logic (simplified placeholder)
console.log('Chat room loaded for:', currentRoom);
</script>
</body>
</html>
