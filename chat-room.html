<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<link rel="stylesheet" href="style.css">
<style>
  .chat-container { display: flex; flex-direction: column; height: 100vh; }
  .messages { flex: 1; overflow-y: auto; padding: 10px; }
  .composer { display: flex; flex-direction: column; padding: 10px; border-top: 1px solid #ccc; }
  .composer-row { display: flex; gap: 8px; }
  .message-input { flex: 1; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  .send-btn { height: 48px; padding: 0 20px; background: linear-gradient(135deg, #4cb8b9 0%, #7bafdd 55%, #b0dc77 100%); color: white; border: none; border-radius: 8px; font-size: 16px; }
  .prayer-btn { height: 40px; margin-top: 8px; background: #8845a5; color: white; border: none; border-radius: 8px; font-size: 14px; }
  .prayer-btn.active { background: #ac8ce6; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="messages" id="messages"></div>
  <div class="composer">
    <div class="composer-row">
      <input type="text" id="messageInput" class="message-input" placeholder="Type a message...">
      <button id="sendBtn" class="send-btn">Send</button>
    </div>
    <button id="prayerBtn" class="prayer-btn">🙏 Prayer Request</button>
  </div>
</div>
<script src="app.js"></script>
<script src="auth.js"></script>
<script>
// Chat room logic here - same as before but with new layout
</script>
</body>
</html>
