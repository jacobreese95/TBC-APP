<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats - TBC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>TBC Chats</h1></header>
    <div class="container">
        <button onclick="window.location.href='index.html'" style="margin-bottom:15px;">← Back to Home</button>
        
        <h2>Ministry Chats</h2>
        <button onclick="openChat('Whole Church')" style="width:100%; padding:18px; margin:6px 0;">💬 Whole Church</button>

      function openChat(room) {
        localStorage.setItem('currentChatRoom', room);
