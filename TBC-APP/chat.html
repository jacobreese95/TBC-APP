<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Chats - TBC Church App</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Ministry Chats</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <p style="text-align:center;color:var(--muted);font-size:0.9rem;margin:0 0 8px;">Choose a ministry chat</p>
        <div class="option-grid" id="chat-list">
            <!-- Populated dynamically based on user ministries -->
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:var(--text);">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="directory.html">Church Directory</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:var(--purple); font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="home-logo.js"></script>
    <script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        const allMinistries = ['Whole Church', 'Music Ministry', 'Sentry', 'Nursery', 'Media'];
        const ministryIcons = {
            'Whole Church': '⛪',
            'Music Ministry': '🎵',
            'Sentry': '🛡️',
            'Nursery': '👶',
            'Media': '🎥'
        };

        async function renderChatList() {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            const profile = await requireApprovedUser();
            if (!profile) return;

            const userMinistries = profile.ministries || [];
            const isAdmin = profile.role === 'admin';

            allMinistries.forEach(ministry => {
                if (ministry === 'Whole Church' || isAdmin || userMinistries.includes(ministry)) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'option-tile';
                    btn.innerHTML =
                        '<span class="tile-icon" aria-hidden="true">' + (ministryIcons[ministry] || '💬') + '</span>' +
                        '<span class="tile-label">' + ministry + '</span>';
                    btn.onclick = () => window.location.href = 'chat-room.html?room=' + encodeURIComponent(ministry);
                    container.appendChild(btn);
                }
            });
        }

        renderChatList();
    </script>
</body>
</html>
