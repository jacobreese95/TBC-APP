<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats - TBC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>TBC Chats</h1></header>
    <div class="container menu-stack">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
        <h2>Ministry Chats</h2>
        <button class="menu-btn" onclick="openChat('Whole Church')">Whole Church</button>
        <button class="menu-btn" onclick="openChat('Nursery')">Nursery</button>
        <button class="menu-btn" onclick="openChat('Music - Singing')">Music - Singing</button>
        <button class="menu-btn" onclick="openChat('Music - Piano')">Piano</button>
        <button class="menu-btn" onclick="openChat('Sentry')">Sentry</button>
        <button class="menu-btn" onclick="openChat('Media')">Media</button>
    </div>
    <script>
      function openChat(room) {
        localStorage.setItem('currentChatRoom', room);
        window.location.href = 'chat-room.html';
      }
    </script>
</body>
</html>
