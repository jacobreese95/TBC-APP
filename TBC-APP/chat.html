<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Chats - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="about.html">About Us</a>
        <a href="calendar.html" id="drawer-calendar">Calendar</a>
        <a href="chat.html" id="drawer-chats">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="soul-winning.html" id="drawer-soulwinning">Soul Winning</a>
        <a href="upload-photos.html" id="drawer-upload">Upload Photos</a>
        <a href="profile.html" id="drawer-profile">Profile</a>
        <a href="admin.html" id="drawer-admin" style="display:none;">Admin</a>
        <a href="#" id="drawer-logout" onclick="signOutUser().then(() => window.location.reload())">Logout</a>
    </div>

    <header>
        <h1>Ministry Chats</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
        
        <div id="chat-list" style="margin: 20px 0;">
            Loading chats...
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        requireApprovedUser().then(async function(profile) {
            if (!profile) return;
            
            const container = document.getElementById('chat-list');
            container.innerHTML = '';
            
            const isAdmin = profile.role === 'admin';
            const userMinistries = profile.ministries || ['Whole Church'];
            
            // Always show Whole Church
            const wholeChurch = document.createElement('a');
            wholeChurch.href = 'chat-room.html?room=Whole Church';
            wholeChurch.className = 'menu-btn';
            wholeChurch.textContent = 'Whole Church';
            container.appendChild(wholeChurch);
            
            // Show ministry chats
            const ministryChats = [
                { name: 'Young Adults', color: 'linear-gradient(135deg, #7bafdd, #4cb8b9)' },
                { name: 'Music Ministry', color: 'linear-gradient(135deg, #ac8ce6, #8845a5)' },
                { name: 'Nursery', color: 'linear-gradient(135deg, #b0dc77, #4cb8b9)' },
                { name: 'Media', color: 'linear-gradient(135deg, #7a8fac, #8845a5)' }
            ];
            
            ministryChats.forEach(chat => {
                if (isAdmin || userMinistries.includes(chat.name)) {
                    const link = document.createElement('a');
                    link.href = `chat-room.html?room=${encodeURIComponent(chat.name)}`;
                    link.className = 'menu-btn';
                    link.style.marginTop = '12px';
                    link.style.background = chat.color;
                    link.textContent = chat.name;
                    container.appendChild(link);
                }
            });
            
            if (container.children.length === 1 && !isAdmin) {
                const note = document.createElement('p');
                note.style.marginTop = '20px';
                note.style.color = '#666';
                note.textContent = 'You are only in the Whole Church chat. Ask an admin to add you to other ministry chats.';
                container.appendChild(note);
            }

            // Show/hide drawer items based on login
            const drawerProfile = document.getElementById('drawer-profile');
            const drawerLogout = document.getElementById('drawer-logout');
            const drawerCalendar = document.getElementById('drawer-calendar');
            const drawerChats = document.getElementById('drawer-chats');
            const drawerSoul = document.getElementById('drawer-soulwinning');
            const drawerUpload = document.getElementById('drawer-upload');
            const drawerAdmin = document.getElementById('drawer-admin');

            drawerProfile.style.display = 'block';
            drawerLogout.style.display = 'block';
            drawerCalendar.style.display = 'block';
            drawerChats.style.display = 'block';
            drawerSoul.style.display = 'block';
            drawerUpload.style.display = 'block';

            if (profile && profile.role === 'admin') {
                drawerAdmin.style.display = 'block';
            } else {
                drawerAdmin.style.display = 'none';
            }
            if (profile && !profile.approved) {
                drawerProfile.style.display = 'none';
            }
        });
    </script>
</body>
</html>
