<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Chats - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Sentry Error Tracking -->
    <script src="https://browser.sentry-cdn.com/7.119.0/bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Ministry Chats</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="chat-list menu-stack">
            <button class="menu-btn" onclick="window.location.href='chat-room.html?room=Whole Church'">Whole Church</button>
            <button class="menu-btn" onclick="window.location.href='chat-room.html?room=Music Ministry'">Music Ministry</button>
            <button class="menu-btn" onclick="window.location.href='chat-room.html?room=Nursery'">Nursery</button>
            <button class="menu-btn" onclick="window.location.href='chat-room.html?room=Media'">Media</button>
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:#8845a5; font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        // Initialize Sentry (replace DSN with your project key)
        if (typeof Sentry !== 'undefined') {
            Sentry.init({
                dsn: 'YOUR_SENTRY_DSN_HERE', // <-- paste your Sentry DSN here
                tracesSampleRate: 1.0,
            });
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }
        requireApprovedUser();
    </script>
</body>
</html>
