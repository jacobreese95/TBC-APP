<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Room - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            right: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100%;
        }
        header {
            flex-shrink: 0;
            width: 100%;
            box-sizing: border-box;
            padding-left: 16px !important;
            padding-right: 56px !important;
            position: relative;
            z-index: 10;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 16px !important;
            margin: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0;
            position: relative;
            z-index: 1;
        }
        .week-header {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            overflow-x: auto;
            flex-shrink: 0;
            width: 100%;
        }
        .week-day {
            flex: 1;
            min-width: 50px;
            text-align: center;
            padding: 10px 4px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        .week-day.today { border-color: #7bafdd; border-width: 2px; }
        .chat-messages {
            flex: 1 1 auto;
            height: 0;
            overflow-y: scroll;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 12px;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        .message {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.sent { background: #4cb8b9; color: white; margin-left: auto; }
        .message.received { background: white; border: 1px solid #ddd; }
        .message.prayer { background: #f3e8ff; border: 2px solid #8845a5; color: #404040; }
        .message.prayer strong { color: #8845a5; }
        .prayer-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.8rem;
            color: #8845a5;
            font-weight: bold;
        }
        .composer {
            flex-shrink: 0;
            background: #fff;
            padding: 10px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 50;
            pointer-events: auto;
        }
        .composer textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 16px;
            resize: none;
            min-height: 56px;
            height: 56px;
            line-height: 1.4;
            box-sizing: border-box;
            pointer-events: auto !important;
            -webkit-user-select: text;
            user-select: text;
            position: relative;
            z-index: 51;
            background: #fff;
        }
        .composer button {
            width: 100% !important;
            padding: 14px 20px !important;
            border-radius: 16px !important;
            background: #4cb8b9 !important;
            color: white !important;
            border: none !important;
            font-weight: bold !important;
            font-size: 16px !important;
            margin: 0 !important;
            display: block !important;
            box-sizing: border-box !important;
            pointer-events: auto !important;
            position: relative;
            z-index: 51;
        }
        .composer .prayer-btn {
            background: #8845a5 !important;
        }
        .day-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .day-modal.open { display: flex; }
        .day-modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .day-modal h3 { margin-top: 0; color: #404040; }
        .day-event { padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <button onclick="history.back()" class="back-btn">← Back</button>
        <h1 id="room-title">Chat</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="week-header" id="week-header"></div>
        <div class="chat-messages" id="chat-messages"></div>

        <div class="composer" id="composer">
            <textarea id="message-input" placeholder="Type a message..."></textarea>
            <button type="button" id="sendBtn">Send</button>
            <button type="button" id="prayerBtn" class="prayer-btn" style="display:none;">🙏 Prayer Request</button>
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:#8845a5; font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <!-- Day Preview Modal -->
    <div class="day-modal" id="day-modal" onclick="if (event.target.id === 'day-modal') closeDayModal()">
        <div class="day-modal-content">
            <h3 id="day-modal-title"></h3>
            <div id="day-modal-events"></div>
            <button onclick="closeDayModal()" style="width:100%; margin-top:10px; background:#7a8fac; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold;">Close</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        let room = new URLSearchParams(window.location.search).get('room') || 'Whole Church';
        let currentUser = null;
        let displayName = 'User';
        let isSending = false;

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('open');
        }

        function showDayPreview(date) {
            const modal = document.getElementById('day-modal');
            const titleEl = document.getElementById('day-modal-title');
            const eventsEl = document.getElementById('day-modal-events');

            const dateStr = date.toISOString().split('T')[0];
            titleEl.textContent = date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            eventsEl.innerHTML = '<p style="color:#666;">Loading events...</p>';
            modal.classList.add('open');

            db.collection('events')
              .where('date', '==', dateStr)
              .where('ministry', '==', room)
              .get()
              .then(snapshot => {
                  eventsEl.innerHTML = '';
                  if (snapshot.empty) {
                      eventsEl.innerHTML = '<p style="color:#666;">No events scheduled for this day.</p>';
                      return;
                  }
                  snapshot.forEach(doc => {
                      const ev = doc.data();
                      const div = document.createElement('div');
                      div.className = 'day-event';
                      div.innerHTML = `<strong>${ev.title || 'Event'}</strong><br>${ev.description || ''}`;
                      eventsEl.appendChild(div);
                  });
              })
              .catch(e => {
                  eventsEl.innerHTML = '<p style="color:#c00;">Error loading events.</p>';
              });
        }

        function renderWeekHeader() {
            const header = document.getElementById('week-header');
            header.innerHTML = '';
            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const div = document.createElement('div');
                div.className = 'week-day' + (i === 0 ? ' today' : '');
                div.innerHTML = `<div style="font-size:0.75rem;opacity:0.7;">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div style="font-weight:bold;">${d.getDate()}</div>`;
                div.onclick = () => showDayPreview(d);
                header.appendChild(div);
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            container.scrollTop = container.scrollHeight;
        }

        function loadMessages() {
            const container = document.getElementById('chat-messages');
            db.collection('chats').doc(room).collection('messages').orderBy('createdAt').get()
              .then(snapshot => {
                  container.innerHTML = '';
                  snapshot.forEach(doc => {
                      const m = doc.data();
                      const div = document.createElement('div');
                      let classes = 'message ';
                      if (m.isPrayer) {
                          classes += 'prayer';
                      } else {
                          classes += (m.uid === currentUser.uid ? 'sent' : 'received');
                      }
                      div.className = classes;
                      const name = m.name || displayName || 'User';
                      let html = `<strong>${name}</strong><br>${m.text}`;
                      if (m.isPrayer) {
                          html += `<div class="prayer-tag">🙏 Prayer Request</div>`;
                      }
                      div.innerHTML = html;
                      container.appendChild(div);
                  });
                  scrollToBottom();
              })
              .catch(e => console.error(e));
        }

        function sendMessage(isPrayer) {
            if (isSending || !currentUser) return;

            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            isSending = true;

            input.value = '';
            input.focus();

            db.collection('chats').doc(room).collection('messages').add({
                text,
                uid: currentUser.uid,
                name: displayName,
                isPrayer: !!isPrayer,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                isSending = false;
                input.focus();
            })
            .catch(e => {
                isSending = false;
                alert('Error sending: ' + e.message);
                input.value = text;
                input.focus();
            });
        }

        async function init() {
            currentUser = await requireApprovedUser();
            if (currentUser && currentUser.uid) {
                try {
                    const userDoc = await db.collection('users').doc(currentUser.uid).get();
                    if (userDoc.exists) {
                        const u = userDoc.data();
                        displayName = u.name || u.displayName || currentUser.displayName || 'User';
                    } else {
                        displayName = currentUser.displayName || currentUser.name || 'User';
                    }
                } catch(e) {
                    displayName = currentUser.displayName || currentUser.name || 'User';
                }
            }

            document.getElementById('room-title').textContent = room;

            if (room === 'Whole Church') {
                document.getElementById('prayerBtn').style.display = 'block';
            }

            renderWeekHeader();

            const input = document.getElementById('message-input');

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(false);
                }
            });

            document.getElementById('sendBtn').addEventListener('click', function() {
                sendMessage(false);
            });
            document.getElementById('prayerBtn').addEventListener('click', function() {
                sendMessage(true);
            });

            input.addEventListener('click', function() {
                input.focus();
            });

            db.collection('chats').doc(room).collection('messages')
              .orderBy('createdAt')
              .onSnapshot(() => {
                  loadMessages();
              });
        }

        init();
    </script>
</body>
</html>
