<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat Room - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            -webkit-overflow-scrolling: auto;
        }
        body {
            display: flex;
            flex-direction: column;
            touch-action: none;
        }
        header {
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 16px;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0;
            touch-action: none;
        }
        .week-header {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            overflow-x: auto;
            flex-shrink: 0;
            touch-action: pan-x;
        }
        .week-day {
            flex: 1;
            min-width: 60px;
            text-align: center;
            padding: 10px 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        .week-day.today { border-color: #7bafdd; border-width: 2px; }
        .chat-messages {
            flex: 1 1 auto;
            height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            touch-action: pan-y;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .message {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.sent { background: #4cb8b9; color: white; margin-left: auto; }
        .message.received { background: white; border: 1px solid #ddd; }
        .message.prayer { background: #f3e8ff; border: 2px solid #8845a5; color: #404040; }
        .message.prayer strong { color: #8845a5; }
        .prayer-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.8rem;
            color: #8845a5;
            font-weight: bold;
        }
        .composer {
            flex-shrink: 0;
            background: #fff;
            padding: 10px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            touch-action: manipulation;
        }
        .composer textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 16px;
            resize: none;
            min-height: 56px;
            height: 56px;
            line-height: 1.4;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        .composer button {
            align-self: flex-end;
            padding: 10px 28px;
            border-radius: 20px;
            background: #4cb8b9;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 15px;
            touch-action: manipulation;
        }
        .composer .prayer-btn {
            background: #8845a5;
        }
    </style>
</head>
<body>
    <header>
        <button onclick="history.back()" class="back-btn">← Back</button>
        <h1 id="room-title">Chat</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="week-header" id="week-header"></div>
        <div class="chat-messages" id="chat-messages"></div>

        <div class="composer" id="composer">
            <textarea id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage(false);}"></textarea>
            <button onclick="sendMessage(false)">Send</button>
            <button id="prayerBtn" class="prayer-btn" onclick="sendMessage(true)" style="display:none;">🙏 Prayer Request</button>
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:#8845a5; font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        let room = new URLSearchParams(window.location.search).get('room') || 'Whole Church';
        let currentUser = null;

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function renderWeekHeader() {
            const header = document.getElementById('week-header');
            header.innerHTML = '';
            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const div = document.createElement('div');
                div.className = 'week-day' + (i === 0 ? ' today' : '');
                div.innerHTML = `<div style="font-size:0.75rem;opacity:0.7;">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div style="font-weight:bold;">${d.getDate()}</div>`;
                div.onclick = () => window.location.href = 'calendar.html';
                header.appendChild(div);
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-messages');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 50);
        }

        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            try {
                const snapshot = await db.collection('chats').doc(room).collection('messages').orderBy('createdAt').get();
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const div = document.createElement('div');
                    let classes = 'message ';
                    if (m.isPrayer) {
                        classes += 'prayer';
                    } else {
                        classes += (m.uid === currentUser.uid ? 'sent' : 'received');
                    }
                    div.className = classes;
                    const displayName = m.name || currentUser.displayName || currentUser.name || 'User';
                    let html = `<strong>${displayName}</strong><br>${m.text}`;
                    if (m.isPrayer) {
                        html += `<div class="prayer-tag">🙏 Prayer Request</div>`;
                    }
                    div.innerHTML = html;
                    container.appendChild(div);
                });
                scrollToBottom();
            } catch(e) {
                console.error(e);
            }
        }

        async function sendMessage(isPrayer) {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            input.value = '';

            let displayName = currentUser.displayName || currentUser.name || 'User';
            if (displayName === 'User' && currentUser.uid) {
                try {
                    const userDoc = await db.collection('users').doc(currentUser.uid).get();
                    if (userDoc.exists) {
                        const u = userDoc.data();
                        displayName = u.name || u.displayName || 'User';
                    }
                } catch(e) {}
            }

            try {
                await db.collection('chats').doc(room).collection('messages').add({
                    text,
                    uid: currentUser.uid,
                    name: displayName,
                    isPrayer: !!isPrayer,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e) {
                alert('Error sending: ' + e.message);
                input.value = text;
            }
        }

        async function init() {
            currentUser = await requireApprovedUser();
            if (currentUser && currentUser.uid) {
                try {
                    const userDoc = await db.collection('users').doc(currentUser.uid).get();
                    if (userDoc.exists) {
                        const u = userDoc.data();
                        currentUser.displayName = u.name || u.displayName || currentUser.displayName || 'User';
                        currentUser.name = currentUser.displayName;
                    }
                } catch(e) {}
            }

            document.getElementById('room-title').textContent = room;

            if (room === 'Whole Church') {
                document.getElementById('prayerBtn').style.display = 'block';
            }

            renderWeekHeader();

            // Prevent the whole page from being pulled/dragged
            document.body.addEventListener('touchmove', function(e) {
                if (!e.target.closest('.chat-messages') && !e.target.closest('.week-header')) {
                    e.preventDefault();
                }
            }, { passive: false });

            db.collection('chats').doc(room).collection('messages')
              .orderBy('createdAt')
              .onSnapshot(() => {
                  loadMessages();
              });
        }

        init();
    </script>
</body>
</html>
