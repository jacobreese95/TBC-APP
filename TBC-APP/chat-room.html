<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - TBC</title>
    <link rel="stylesheet" href="style.css">
    <style>
      #week-schedule {
        padding: 14px 16px;
        background: linear-gradient(180deg, rgba(123,175,221,0.25) 0%, #dedcd0 100%);
        overflow-x: auto;
      }
      .week-row { display:flex; gap:8px; overflow-x:auto; }
      .week-day {
        border: 1px solid rgba(122,143,172,0.45);
        background: #fff;
        padding: 10px;
        min-width: 88px;
        text-align: center;
        border-radius: 12px;
        font-size: 0.85rem;
        box-shadow: 0 2px 8px rgba(64,64,64,0.08);
      }
      #chat-messages {
        height: 42vh;
        overflow-y: auto;
        padding: 16px;
        background: #fafbfc;
      }
      #chat-messages .msg {
        background: #fff;
        border-left: 4px solid #4cb8b9;
        padding: 10px 12px;
        border-radius: 0 10px 10px 0;
        margin: 8px 0;
        box-shadow: 0 1px 4px rgba(64,64,64,0.06);
      }
      #chat-messages .msg.prayer {
        border-left-color: #8b5cf6;
        background: #f5f0ff;
      }
      .prayer-badge {
        display: inline-block;
        background: #8b5cf6;
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 2px 8px;
        border-radius: 999px;
        margin-bottom: 6px;
      }
      .chat-composer {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #fff;
        padding: 10px 12px;
        border-top: 1px solid rgba(122,143,172,0.35);
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 -4px 16px rgba(64,64,64,0.08);
      }
      .composer-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chat-composer input {
        flex: 1;
        margin: 0;
        width: auto;
      }
      .chat-composer button {
        width: auto;
        margin: 0;
        padding: 14px 16px;
        flex-shrink: 0;
      }
      #prayer-btn {
        background: #e8e0f8;
        color: #5b21b6;
        border: 2px solid #c4b5fd;
        font-weight: 600;
        font-size: 0.9rem;
      }
      #prayer-btn.active {
        background: #8b5cf6;
        color: #fff;
        border-color: #7c3aed;
      }
      #chat-header { padding: 8px 12px 0; }
      #chat-header h2 { margin: 8px 4px 12px; color: #404040; }
      body { padding-bottom: 110px; }
      #prayer-hint {
        display: none;
        font-size: 0.8rem;
        color: #5b21b6;
        padding: 0 2px;
      }
      #prayer-hint.show { display: block; }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="calendar.html">Calendar</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="#" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank'); toggleMenu(); return false;">View Location on Google Maps</a>
        <a href="soul-winning.html">Soul Winning</a>
    </div>

    <div id="chat-header"></div>
    <div id="week-schedule"></div>
    <div id="chat-messages"></div>
    <div class="chat-composer">
      <div id="prayer-hint">Prayer request mode is on — this will be marked as a prayer request.</div>
      <div class="composer-row">
        <input type="text" id="chat-input" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="prayer-btn" type="button" onclick="togglePrayer()" style="display:none;">🙏 Prayer</button>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
    <script>
      function toggleMenu() {
        document.getElementById('navDrawer').classList.toggle('open');
        document.getElementById('navOverlay').classList.toggle('open');
      }

      const room = localStorage.getItem('currentChatRoom') || 'Nursery';
      const isWholeChurch = room === 'Whole Church';
      let isPrayerRequest = false;

      document.getElementById('chat-header').innerHTML = `
        <button class="back-btn" onclick="window.location.href='chat.html'">← Back</button>
        <h2>${room} Chat</h2>
      `;

      // Show Prayer button only in Whole Church chat
      if (isWholeChurch) {
        document.getElementById('prayer-btn').style.display = 'inline-block';
      }

      function togglePrayer() {
        isPrayerRequest = !isPrayerRequest;
        const btn = document.getElementById('prayer-btn');
        const hint = document.getElementById('prayer-hint');
        btn.classList.toggle('active', isPrayerRequest);
        hint.classList.toggle('show', isPrayerRequest);
        btn.textContent = isPrayerRequest ? '🙏 Prayer ✓' : '🙏 Prayer';
      }

      let events = JSON.parse(localStorage.getItem('events') || '[]');
      const weekEvents = events.filter(e => (e.ministry === room || e.ministry === "Church Wide") && e.day >= 19 && e.day <= 26);

      let weekHTML = '<div class="week-row">';
      for (let d = 19; d <= 26; d++) {
        const dayEvents = weekEvents.filter(e => e.day === d);
        weekHTML += `
          <div class="week-day">
            <strong>Day ${d}</strong><br>
            ${dayEvents.length ? dayEvents.map(e => `${e.time} - ${e.title}`).join('<br>') : 'No events'}
          </div>`;
      }
      weekHTML += '</div>';
      document.getElementById('week-schedule').innerHTML = weekHTML;

      // Load messages — support old string format and new object format
      let raw = JSON.parse(localStorage.getItem('chat_' + room) || '[]');
      let chatHistory = raw.map(item => {
        if (typeof item === 'string') return { text: item, isPrayer: false, time: null };
        return item;
      });

      function renderChatMessages() {
        const container = document.getElementById('chat-messages');
        if (!chatHistory.length) {
          container.innerHTML = '<p class="msg">No messages yet.</p>';
          return;
        }
        let html = '';
        chatHistory.forEach(msg => {
          if (msg.isPrayer) {
            html += `<div class="msg prayer"><span class="prayer-badge">🙏 Prayer Request</span><div><strong>You:</strong> ${escapeHtml(msg.text)}</div></div>`;
          } else {
            html += `<div class="msg"><strong>You:</strong> ${escapeHtml(msg.text)}</div>`;
          }
        });
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&')
          .replace(/</g, '<')
          .replace(/>/g, '>')
          .replace(/"/g, '"');
      }

      function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const message = {
          text: text,
          isPrayer: isWholeChurch && isPrayerRequest,
          time: new Date().toISOString()
        };

        chatHistory.push(message);
        localStorage.setItem('chat_' + room, JSON.stringify(chatHistory));

        // Placeholder for future push notifications on prayer requests
        if (message.isPrayer) {
          console.log('Prayer request ready for push notification:', message.text);
        }

        renderChatMessages();
        input.value = '';

        // Turn prayer mode off after sending so the next message is normal by default
        if (isPrayerRequest) {
          isPrayerRequest = false;
          document.getElementById('prayer-btn').classList.remove('active');
          document.getElementById('prayer-btn').textContent = '🙏 Prayer';
          document.getElementById('prayer-hint').classList.remove('show');
        }
      }

      renderChatMessages();
    </script>
</body>
</html>
