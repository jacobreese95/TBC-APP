<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .week-header { display: flex; gap: 4px; margin: 15px 0; overflow-x: auto; }
        .week-day { flex: 1; min-width: 60px; text-align: center; padding: 10px 6px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
        .week-day.has-event { background: #4cb8b9; color: white; }
        .week-day.today { border-color: #7bafdd; border-width: 2px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; border-radius: 12px; margin-bottom: 15px; }
        .message { margin: 8px 0; padding: 10px 14px; border-radius: 18px; max-width: 80%; }
        .message.sent { background: #4cb8b9; color: white; margin-left: auto; }
        .message.received { background: white; border: 1px solid #ddd; }
        .composer { display: flex; gap: 10px; align-items: flex-end; }
        .composer textarea { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 16px; resize: vertical; min-height: 120px; max-height: 200px; line-height: 1.4; }
        .composer button { padding: 8px 16px; border-radius: 20px; background: #4cb8b9; color: white; border: none; font-weight: bold; font-size: 14px; white-space: nowrap; }
    </style>
</head>
<body>
    <header>
        <button onclick="history.back()" class="back-btn">← Back</button>
        <h1 id="room-title">Chat</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="week-header" id="week-header"></div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="composer">
            <textarea id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:#8845a5; font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        let room = new URLSearchParams(window.location.search).get('room') || 'Whole Church';
        let currentUser = null;

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function renderWeekHeader() {
            const header = document.getElementById('week-header');
            header.innerHTML = '';
            const today = new Date();
            for (let i = -3; i <= 3; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const div = document.createElement('div');
                div.className = 'week-day';
                if (i === 0) div.classList.add('today');
                div.innerHTML = `<div style="font-size:0.75rem;opacity:0.7;">${d.toLocaleDateString('en-US',{weekday:'short'})}</div><div style="font-weight:bold;">${d.getDate()}</div>`;
                div.onclick = () => window.location.href = 'calendar.html';
                header.appendChild(div);
            }
        }

        async function loadMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            try {
                const snapshot = await db.collection('chats').doc(room).collection('messages').orderBy('createdAt').get();
                snapshot.forEach(doc => {
                    const m = doc.data();
                    const div = document.createElement('div');
                    div.className = `message ${m.uid === currentUser.uid ? 'sent' : 'received'}`;
                    let displayName = m.name || currentUser.displayName || currentUser.name || 'User';
                    if (displayName === 'User' && currentUser.uid) {
                        // fallback: fetch from users collection
                        db.collection('users').doc(currentUser.uid).get().then(userDoc => {
                            if (userDoc.exists) {
                                const u = userDoc.data();
                                displayName = u.name || u.displayName || 'User';
                            }
                        });
                    }
                    div.innerHTML = `<strong>${displayName}</strong><br>${m.text}`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch(e) { console.error(e); }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;
            let displayName = currentUser.displayName || currentUser.name || 'User';
            if (displayName === 'User' && currentUser.uid) {
                const userDoc = await db.collection('users').doc(currentUser.uid).get();
                if (userDoc.exists) {
                    const u = userDoc.data();
                    displayName = u.name || u.displayName || 'User';
                }
            }
            try {
                await db.collection('chats').doc(room).collection('messages').add({
                    text,
                    uid: currentUser.uid,
                    name: displayName,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                input.value = '';
                await loadMessages();
            } catch(e) { alert('Error sending: ' + e.message); }
        }

        async function init() {
            currentUser = await requireApprovedUser();
            // ensure we have the real name from Firestore
            if (currentUser && currentUser.uid) {
                try {
                    const userDoc = await db.collection('users').doc(currentUser.uid).get();
                    if (userDoc.exists) {
                        const u = userDoc.data();
                        currentUser.displayName = u.name || u.displayName || currentUser.displayName || 'User';
                        currentUser.name = currentUser.displayName;
                    }
                } catch(e) {}
            }
            document.getElementById('room-title').textContent = room;
            renderWeekHeader();
            await loadMessages();
            db.collection('chats').doc(room).collection('messages').orderBy('createdAt').onSnapshot(() => loadMessages());
        }
        init();
    </script>
</body>
</html>
