<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TBC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="#" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank'); toggleMenu(); return false;">View Location on Google Maps</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <div class="container" style="max-width:360px; margin-top:60px;">
        <h2 style="text-align:center;">Create an Account</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="date" id="birthday">
        <input type="tel" id="phone" placeholder="Phone Number">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="address" placeholder="Address">
        <input type="password" id="password" placeholder="Password (min 6 characters)">
        <button class="menu-btn" onclick="createAccount()">Create Account</button>
        <p style="text-align:center; margin-top:12px;"><a href="login.html">Already have an account? Login</a></p>
        <p id="error" style="color:#c0392b; text-align:center; display:none;"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
      function toggleMenu() {
        document.getElementById('navDrawer').classList.toggle('open');
        document.getElementById('navOverlay').classList.toggle('open');
      }
      async function createAccount() {
        const errEl = document.getElementById('error');
        errEl.style.display = 'none';
        try {
          await signUpUser({
            name: document.getElementById('name').value,
            birthday: document.getElementById('birthday').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            password: document.getElementById('password').value
          });
          window.location.href = 'pending.html';
        } catch (e) {
          errEl.textContent = authErrorMessage(e);
          errEl.style.display = 'block';
        }
      }
    </script>
</body>
</html>
