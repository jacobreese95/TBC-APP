        </div>
    </div>

    <script>
        // This will load and display all saved notes later
        function loadNotes() {
            const notesList = document.getElementById('notes-list');
            const notes = [];

            // Look through localStorage for any notes
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('note-')) {
                    notes.push({
                        reference: key.replace('note-', ''),
                        text: localStorage.getItem(key)
                    });
                }
            }

                notesList.innerHTML = `<p style="color: #888;">You don’t have any notes yet.</p>`;
