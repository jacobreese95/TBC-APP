<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes - TBC Bible</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .note-card { background: var(--surface); border-left: 4px solid var(--purple, #8845a5); padding: 14px; margin: 12px 0; border-radius: 10px; box-shadow: var(--shadow); }
    .note-ref { font-weight: 700; color: var(--teal); font-size: 1.05rem; margin-bottom: 8px; text-decoration: none; display: inline-block; }
    .note-textarea { width: 100%; min-height: 80px; padding: 10px; border: 2px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; resize: vertical; box-sizing: border-box; background: var(--input-bg); color: var(--text); }
    .empty-msg { color: var(--muted); text-align: center; margin-top: 40px; line-height: 1.5; }
    .save-msg { color: var(--teal); font-size: 0.85rem; margin-top: 6px; display: none; }
    .note-actions { display: flex; gap: 8px; margin-top: 8px; }
    .note-actions button { flex: 1; margin: 0; height: 40px; font-size: 0.9rem; }
    .btn-danger { background: #c62828 !important; }
    .btn-secondary { background: var(--input-bg) !important; color: var(--text) !important; border: 2px solid var(--border) !important; box-shadow: none !important; }
  </style>
</head>
<body>
  <a class="home-logo-btn" href="../index.html" title="Home"><img src="../tbclogo.jpeg" alt="TBC Home"></a>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
  <div class="nav-drawer" id="navDrawer">
    <a href="../index.html">Home</a>
    <a href="index.html">Bible</a>
    <a href="../sermons.html">Sermons</a>
  </div>
  <header><h1>My Notes</h1></header>
  <div class="container">
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Bible</button>
    <p style="margin-bottom: 16px; color: var(--muted); font-size: 0.95rem;">Notes are saved on this device. Tap a reference to open that verse.</p>
    <div id="notes-list"><p class="empty-msg">Loading notes…</p></div>
  </div>
  <script src="data/books.js"></script>
  <script src="bible-chrome.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById('navDrawer').classList.toggle('open');
      document.getElementById('navOverlay').classList.toggle('open');
    }
    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function readerLink(reference) {
      var parsed = parseBibleRef(reference);
      if (!parsed) return 'index.html';
      var url = 'reader.html?book=' + encodeURIComponent(parsed.book.name) + '&chapter=' + parsed.chapter;
      if (parsed.verse) url += '&verse=' + parsed.verse;
      return url;
    }
    function saveNote(reference, text) {
      if (text.trim() === '') localStorage.removeItem(noteKey(reference));
      else localStorage.setItem(noteKey(reference), text);
      var msg = document.getElementById('save-' + reference.replace(/[^a-zA-Z0-9]/g, '-'));
      if (msg) { msg.style.display = 'block'; setTimeout(function () { msg.style.display = 'none'; }, 1500); }
    }
    function deleteNote(reference) {
      if (!confirm('Delete note for ' + reference + '?')) return;
      localStorage.removeItem(noteKey(reference));
      loadNotes();
    }
    function loadNotes() {
      var notesList = document.getElementById('notes-list');
      var notes = [];
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key && key.indexOf('note-') === 0 && key.indexOf('noteid-') !== 0) {
          var text = localStorage.getItem(key);
          if (text && text.trim()) notes.push({ reference: key.replace(/^note-/, ''), text: text });
        }
      }
      notes = notes.filter(function (n) { return n.reference.indexOf('id-') !== 0; });
      if (!notes.length) {
        notesList.innerHTML = '<p class="empty-msg">You don’t have any notes yet.<br>Open a verse in the Bible, tap it, and write a note.</p>';
        return;
      }
      notes.sort(function (a, b) { return a.reference.localeCompare(b.reference, undefined, { numeric: true }); });
      var html = '';
      notes.forEach(function (note) {
        var safeId = note.reference.replace(/[^a-zA-Z0-9]/g, '-');
        html += '<div class="note-card"><a class="note-ref" href="' + readerLink(note.reference) + '">' + escapeHtml(note.reference) + '</a>' +
          '<textarea class="note-textarea" data-ref="' + escapeHtml(note.reference) + '" placeholder="Write or edit your note…">' + escapeHtml(note.text) + '</textarea>' +
          '<div class="note-actions"><button type="button" class="btn-secondary save-btn" data-ref="' + escapeHtml(note.reference) + '">Save</button>' +
          '<button type="button" class="btn-danger del-btn" data-ref="' + escapeHtml(note.reference) + '">Delete</button></div>' +
          '<div class="save-msg" id="save-' + safeId + '">Saved</div></div>';
      });
      notesList.innerHTML = html;
      notesList.querySelectorAll('.save-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var ref = btn.getAttribute('data-ref');
          var area = btn.closest('.note-card').querySelector('textarea');
          saveNote(ref, area.value);
        });
      });
      notesList.querySelectorAll('.del-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { deleteNote(btn.getAttribute('data-ref')); });
      });
      notesList.querySelectorAll('.note-textarea').forEach(function (ta) {
        ta.addEventListener('blur', function () { saveNote(ta.getAttribute('data-ref'), ta.value); });
      });
    }
    loadNotes();
  </script>
</body>
</html>
