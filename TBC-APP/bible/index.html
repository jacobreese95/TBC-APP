<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible - TBC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>King James Bible</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Home</button>

        <input type="text" id="global-search" class="search-bar" placeholder="Search the Bible (e.g. light, Adam, serpent)..." oninput="searchBible()">

        <div id="search-results"></div>

        <div class="main-buttons" id="main-buttons">
            <button class="big-btn" onclick="window.location.href='old-testament/index.html'">Old Testament</button>
            <button class="big-btn" onclick="window.location.href='new-testament/index.html'">New Testament</button>
        </div>

        <button class="notes-btn" onclick="window.location.href='my-notes.html'">My Notes</button>
    </div>

    <script>
        const bibleVerses = [
            { ref: "Genesis 1:1", text: "In the beginning God created the heaven and the earth.", chapter: 1 },
            { ref: "Genesis 1:2", text: "And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.", chapter: 1 },
            { ref: "Genesis 1:3", text: "And God said, Let there be light: and there was light.", chapter: 1 },
            { ref: "Genesis 1:4", text: "And God saw the light, that it was good: and God divided the light from the darkness.", chapter: 1 },
            { ref: "Genesis 1:5", text: "And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.", chapter: 1 },
            { ref: "Genesis 1:26", text: "And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth.", chapter: 1 },
            { ref: "Genesis 1:27", text: "So God created man in his own image, in the image of God created he him; male and female created he them.", chapter: 1 },
            { ref: "Genesis 1:31", text: "And God saw every thing that he had made, and, behold, it was very good. And the evening and the morning were the sixth day.", chapter: 1 },
            { ref: "Genesis 2:7", text: "And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.", chapter: 2 },
            { ref: "Genesis 2:8", text: "And the LORD God planted a garden eastward in Eden; and there he put the man whom he had formed.", chapter: 2 },
            { ref: "Genesis 2:18", text: "And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him.", chapter: 2 },
            { ref: "Genesis 2:24", text: "Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.", chapter: 2 },
            { ref: "Genesis 3:1", text: "Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of every tree of the garden?", chapter: 3 },
            { ref: "Genesis 3:15", text: "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel.", chapter: 3 },
            { ref: "Genesis 3:19", text: "In the sweat of thy face shalt thou eat bread, till thou return unto the ground; for out of it wast thou taken: for dust thou art, and unto dust shalt thou return.", chapter: 3 }
        ];

        function highlight(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp('(' + escaped + ')', 'gi'), '<mark>$1</mark>');
        }

        function searchBible() {
            const query = document.getElementById('global-search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            const mainButtons = document.getElementById('main-buttons');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                mainButtons.style.display = 'block';
                return;
            }

            mainButtons.style.display = 'none';
            const matches = bibleVerses.filter(v =>
                v.text.toLowerCase().includes(query) || v.ref.toLowerCase().includes(query)
            );

            if (matches.length === 0) {
                resultsDiv.innerHTML = '<p class="search-count">No results found. Search currently covers sample Genesis verses. More books coming soon.</p>';
                return;
            }

            let html = '<p class="search-count">' + matches.length + ' result(s)</p>';
            matches.forEach(v => {
                html += `<div class="search-result" onclick="window.location.href='old-testament/genesis/chapter-${v.chapter}/index.html'"><div class="search-ref">${v.ref}</div><div class="search-text">${highlight(v.text, query)}</div></div>`;
            });
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
