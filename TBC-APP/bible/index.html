<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible - TBC</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .main-buttons { display: flex; flex-direction: column; gap: 12px; margin: 18px 0; }
    .big-btn {
      width: 100%;
      margin: 0;
      min-height: 56px;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .notes-btn {
      width: 100%;
      margin: 8px 0 0;
      background: linear-gradient(135deg, #8845a5 0%, #ac8ce6 100%) !important;
    }
    .search-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin: 6px 0 0;
      text-align: center;
    }
    .jump-error {
      display: none;
      color: #c62828;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <a id="home-logo-btn" class="home-logo-btn" href="../index.html" title="Home" aria-label="Go to home">
    <img src="../tbclogo.jpeg" alt="TBC Home">
  </a>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
  <div class="nav-drawer" id="navDrawer">
    <a href="../index.html">Home</a>
    <a href="../calendar.html">Calendar</a>
    <a href="../chat.html">Ministry Chats</a>
    <a href="../give.html">Give on Tithe.ly</a>
    <a href="../sermons.html">Sermons & Live Streams</a>
    <a href="../soul-winning.html">Soul Winning</a>
    <a href="my-notes.html">My Notes</a>
  </div>

  <header><h1>King James Bible</h1></header>

  <div class="container">
    <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Home</button>

    <input type="text" id="refSearch" class="search-bar" placeholder="Go to a verse (e.g. John 3:16)" autocomplete="off">
    <p class="search-hint">Type a reference and press Go — or browse by testament below</p>
    <p class="jump-error" id="jumpError">Could not find that reference. Try “John 3:16” or “Genesis 1”.</p>
    <button type="button" class="big-btn" id="goBtn" style="margin-top:10px">Go to verse</button>

    <div class="main-buttons">
      <button class="big-btn" onclick="window.location.href='old-testament/index.html'">Old Testament</button>
      <button class="big-btn" onclick="window.location.href='new-testament/index.html'">New Testament</button>
    </div>

    <button class="notes-btn" onclick="window.location.href='my-notes.html'">My Notes</button>
  </div>

  <script src="data/books.js"></script>
  <script src="bible-chrome.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById('navDrawer').classList.toggle('open');
      document.getElementById('navOverlay').classList.toggle('open');
    }

    function jump() {
      var q = document.getElementById('refSearch').value.trim();
      var err = document.getElementById('jumpError');
      err.style.display = 'none';
      if (!q) return;
      var parsed = parseBibleRef(q);
      if (!parsed) {
        var bookOnly = findKjvBook(q);
        if (bookOnly) {
          window.location.href = 'reader.html?book=' + encodeURIComponent(bookOnly.name) + '&chapter=1';
          return;
        }
        err.style.display = 'block';
        return;
      }
      var url = 'reader.html?book=' + encodeURIComponent(parsed.book.name) +
        '&chapter=' + parsed.chapter;
      if (parsed.verse) url += '&verse=' + parsed.verse;
      window.location.href = url;
    }

    document.getElementById('goBtn').addEventListener('click', jump);
    document.getElementById('refSearch').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') jump();
    });
  </script>
</body>
</html>
