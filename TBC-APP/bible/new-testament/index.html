<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Testament - TBC Bible</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .book-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    @media (min-width: 480px) {
      .book-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .book-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 52px;
      padding: 10px 8px;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .book-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <a class="home-logo-btn" href="../../index.html" title="Home"><img src="../../tbclogo.jpeg" alt="TBC Home"></a>
  <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu"><span></span><span></span><span></span></button>
  <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
  <div class="nav-drawer" id="navDrawer">
    <a href="../../index.html">Home</a>
    <a href="../index.html">Bible</a>
    <a href="../my-notes.html">My Notes</a>
    <a href="../../sermons.html">Sermons</a>
  </div>
  <header><h1>New Testament</h1></header>
  <div class="container">
    <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Bible</button>
    <div class="book-grid" id="bookGrid"></div>
  </div>
  <script src="../data/books.js"></script>
  <script src="../bible-chrome.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById('navDrawer').classList.toggle('open');
      document.getElementById('navOverlay').classList.toggle('open');
    }
    var grid = document.getElementById('bookGrid');
    KJV_BOOKS.filter(function (b) { return b.testament === 'NT'; }).forEach(function (b) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'book-btn';
      btn.textContent = b.name;
      btn.onclick = function () {
        window.location.href = '../reader.html?book=' + encodeURIComponent(b.name) + '&chapter=1';
      };
      grid.appendChild(btn);
    });
  </script>
</body>
</html>
