<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Testament - TBC Bible</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .search-count { color: #666; margin: 10px 0; font-size: 0.9rem; }
        .book-btn.hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>New Testament</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Bible</button>

        <input type="text" id="nt-search" class="search-bar" placeholder="Search New Testament books (e.g. John, Romans)..." oninput="searchNT()">

        <div id="search-results"></div>

        <div class="book-list" id="book-list"></div>
    </div>

    <script>
        const newTestamentBooks = [
            "Matthew", "Mark", "Luke", "John", "Acts",
            "Romans", "1 Corinthians", "2 Corinthians", "Galatians", "Ephesians",
            "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians", "1 Timothy",
            "2 Timothy", "Titus", "Philemon", "Hebrews", "James",
            "1 Peter", "2 Peter", "1 John", "2 John", "3 John",
            "Jude", "Revelation"
        ];

        const bookList = document.getElementById('book-list');

        newTestamentBooks.forEach(book => {
            const btn = document.createElement('div');
            btn.className = 'book-btn';
            btn.textContent = book;
            btn.dataset.book = book.toLowerCase();

            btn.onclick = function() {
                alert("Opening " + book + " (we will build the book pages next)");
            };

            bookList.appendChild(btn);
        });

        function searchNT() {
            const query = document.getElementById('nt-search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            const bookButtons = document.querySelectorAll('.book-btn');

            if (query.length < 1) {
                resultsDiv.innerHTML = '';
                bookButtons.forEach(btn => btn.classList.remove('hidden'));
                return;
            }

            let visible = 0;
            bookButtons.forEach(btn => {
                if (btn.dataset.book.includes(query)) {
                    btn.classList.remove('hidden');
                    visible++;
                } else {
                    btn.classList.add('hidden');
                }
            });

            if (visible === 0) {
                resultsDiv.innerHTML = '<p class="search-count">No books found for "' + query + '".</p>';
            } else {
                resultsDiv.innerHTML = '<p class="search-count">Showing ' + visible + ' matching book' + (visible === 1 ? '' : 's') + '.</p>';
            }
        }
    </script>
</body>
</html>
