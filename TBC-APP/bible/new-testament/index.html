<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Testament - TBC Bible</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>New Testament</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Bible</button>

        <!-- NT Search Bar -->
        <input type="text" id="nt-search" class="search-bar" placeholder="Search the New Testament..." onkeyup="searchNT()">

        <!-- New Testament Books -->
        <div class="book-list" id="book-list">
            <!-- Books will be generated by JavaScript -->
        </div>

        <!-- Search Results -->
        <div id="search-results"></div>
    </div>

    <script>
        // List of New Testament books
        const newTestamentBooks = [
            "Matthew", "Mark", "Luke", "John", "Acts",
            "Romans", "1 Corinthians", "2 Corinthians", "Galatians", "Ephesians",
            "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians", "1 Timothy",
            "2 Timothy", "Titus", "Philemon", "Hebrews", "James",
            "1 Peter", "2 Peter", "1 John", "2 John", "3 John",
            "Jude", "Revelation"
        ];

        // Create book buttons
        const bookList = document.getElementById('book-list');
        newTestamentBooks.forEach(book => {
            const btn = document.createElement('div');
            btn.className = 'book-btn';
            btn.textContent = book;
            btn.onclick = function() {
                alert("Opening " + book + " (we will build the book pages next)");
            };
            bookList.appendChild(btn);
        });

        // Temporary search function
        function searchNT() {
            const query = document.getElementById('nt-search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            resultsDiv.innerHTML = `<p>Searching New Testament for "<strong>${query}</strong>"... (Full search coming soon)</p>`;
        }
    </script>
</body>
</html>
