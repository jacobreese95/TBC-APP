<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Testament - TBC Bible</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <h1>Old Testament</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Bible</button>

        <!-- OT Search Bar -->
        <input type="text" id="ot-search" class="search-bar" placeholder="Search the Old Testament..." onkeyup="searchOT()">

        <!-- Old Testament Books -->
        <div class="book-list" id="book-list">
            <!-- Books will be generated by JavaScript -->
        </div>

        <!-- Search Results -->
        <div id="search-results"></div>
    </div>

    <script>
        // List of Old Testament books
        const oldTestamentBooks = [
            "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy",
            "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel",
            "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles", "Ezra",
            "Nehemiah", "Esther", "Job", "Psalms", "Proverbs",
            "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah", "Lamentations",
            "Ezekiel", "Daniel", "Hosea", "Joel", "Amos",
            "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk",
            "Zephaniah", "Haggai", "Zechariah", "Malachi"
        ];

        // Create book buttons
        const bookList = document.getElementById('book-list');
        oldTestamentBooks.forEach(book => {
            const btn = document.createElement('div');
            btn.className = 'book-btn';
            btn.textContent = book;

            btn.onclick = function() {
                if (book === "Genesis") {
                    window.location.href = "genesis/index.html";
                } else {
                    alert("Opening " + book + " (we will build the rest of the books later)");
                }
            };

            bookList.appendChild(btn);
        });

        // Temporary search function
        function searchOT() {
            const query = document.getElementById('ot-search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                return;
            }

            resultsDiv.innerHTML = `<p>Searching Old Testament for "<strong>${query}</strong>"... (Full search coming soon)</p>`;
        }
    </script>
</body>
</html>
