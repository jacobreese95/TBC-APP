<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Testament - TBC Bible</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .search-result {
            background: #f8f8f8;
            border-left: 4px solid #1a3a5c;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 6px;
            cursor: pointer;
        }
        .search-result:hover { background: #eef3f8; }
        .search-ref { font-weight: bold; color: #1a3a5c; margin-bottom: 4px; }
        .search-text { font-size: 0.95rem; line-height: 1.4; color: #333; }
        .search-count { color: #666; margin: 10px 0; font-size: 0.9rem; }
        mark { background: #ffe066; padding: 0 2px; }
        .book-btn.hidden { display: none; }
    </style>
</head>
<body>
    <a id="home-logo-btn" class="home-logo-btn" href="../../index.html" title="Home" aria-label="Go to home">
        <img src="../../tbclogo.jpeg" alt="TBC Home">
    </a>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="../../index.html">Home</a>
        <a href="../../calendar.html">Calendar</a>
        <a href="../../chat.html">Ministry Chats</a>
        <a href="../index.html">Bible</a>
        <a href="../../give.html">Give on Tithe.ly</a>
        <a href="../../sermons.html">Sermons & Live Streams</a>
        <a href="../../soul-winning.html">Soul Winning</a>
    </div>

    <header>
        <h1>Old Testament</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Bible</button>

        <input type="text" id="ot-search" class="search-bar" placeholder="Search books or verses (e.g. Genesis, light, Adam)..." oninput="searchOT()">

        <div id="search-results"></div>

        <div class="book-list" id="book-list"></div>
    </div>

    <script src="../bible-chrome.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        const oldTestamentBooks = [
            "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy",
            "Joshua", "Judges", "Ruth", "1 Samuel", "2 Samuel",
            "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles", "Ezra",
            "Nehemiah", "Esther", "Job", "Psalms", "Proverbs",
            "Ecclesiastes", "Song of Solomon", "Isaiah", "Jeremiah", "Lamentations",
            "Ezekiel", "Daniel", "Hosea", "Joel", "Amos",
            "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk",
            "Zephaniah", "Haggai", "Zechariah", "Malachi"
        ];

        const sampleVerses = [
            { ref: "Genesis 1:1", text: "In the beginning God created the heaven and the earth.", chapter: 1 },
            { ref: "Genesis 1:3", text: "And God said, Let there be light: and there was light.", chapter: 1 },
            { ref: "Genesis 1:27", text: "So God created man in his own image, in the image of God created he him; male and female created he them.", chapter: 1 },
            { ref: "Genesis 2:7", text: "And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.", chapter: 2 },
            { ref: "Genesis 2:18", text: "And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him.", chapter: 2 },
            { ref: "Genesis 3:1", text: "Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of every tree of the garden?", chapter: 3 },
            { ref: "Genesis 3:15", text: "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel.", chapter: 3 },
            { ref: "Genesis 3:20", text: "And Adam called his wife's name Eve; because she was the mother of all living.", chapter: 3 }
        ];

        const bookList = document.getElementById('book-list');

        oldTestamentBooks.forEach(book => {
            const btn = document.createElement('div');
            btn.className = 'book-btn';
            btn.textContent = book;
            btn.dataset.book = book.toLowerCase();

            btn.onclick = function() {
                if (book === "Genesis") {
                    window.location.href = "genesis/index.html";
                } else {
                    alert("Opening " + book + " (we will build the rest of the books later)");
                }
            };

            bookList.appendChild(btn);
        });

        function highlight(text, query) {
            if (!query) return text;
            const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp('(' + escaped + ')', 'gi');
            return text.replace(re, '<mark>$1</mark>');
        }

        function searchOT() {
            const query = document.getElementById('ot-search').value.trim().toLowerCase();
            const resultsDiv = document.getElementById('search-results');
            const bookButtons = document.querySelectorAll('.book-btn');

            if (query.length < 2) {
                resultsDiv.innerHTML = '';
                bookButtons.forEach(btn => btn.classList.remove('hidden'));
                return;
            }

            let visibleBooks = 0;
            bookButtons.forEach(btn => {
                if (btn.dataset.book.includes(query)) {
                    btn.classList.remove('hidden');
                    visibleBooks++;
                } else {
                    btn.classList.add('hidden');
                }
            });

            const matches = sampleVerses.filter(v =>
                v.text.toLowerCase().includes(query) || v.ref.toLowerCase().includes(query)
            );

            let html = '';

            if (matches.length > 0) {
                html += '<p class="search-count">' + matches.length + ' verse result' + (matches.length === 1 ? '' : 's') + ' (Genesis 1–3)</p>';
                matches.forEach(v => {
                    html += `
                        <div class="search-result" onclick="window.location.href='genesis/chapter-${v.chapter}/index.html'">
                            <div class="search-ref">${v.ref}</div>
                            <div class="search-text">${highlight(v.text, query)}</div>
                        </div>
                    `;
                });
            }

            if (visibleBooks === 0 && matches.length === 0) {
                html = '<p class="search-count">No books or verses found for "' + query + '".</p>';
            } else if (visibleBooks > 0 && matches.length === 0) {
                html = '<p class="search-count">Showing matching books below.</p>';
            }

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
