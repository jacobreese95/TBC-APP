<header><h1>Genesis Chapter 5</h1></header>
<div class="container">

<div id="verses"></div>
</div>
<script>
function w(word,strongs,vines,webster){return{word,strongs,vines,webster}}
const dict={
'and':['Conjunction','And.','And.'],'the':['Article','The.','The.'],'of':['Preposition','Of.','Of.'],'a':['Article','A.','A.'],'an':['Article','An.','An.'],
'in':['Preposition','In.','In.'],'he':['Pronoun','He.','He.'],'his':['Possessive','His.','His.'],'him':['Pronoun','Him.','Him.'],'them':['Pronoun','Them.','Them.'],
'they':['Pronoun','They.','They.'],'this':['Demonstrative','This.','This.'],'is':['Implied','Is.','Is.'],'was':['Implied','Was.','Was.'],'were':['Implied','Were.','Were.'],
'all':['H3605 - kol','All.','All.'],'days':['H3117 - yowm','Days.','Days.'],'day':['H3117 - yowm','Day.','Day.'],'years':['H8141 - shaneh','Years.','Years.'],
'lived':['H2421 - chayah','Lived.','Lived.'],'begat':['H3205 - yalad','Begat.','Begat.'],'died':['H4191 - muwth','Died.','Died.'],
'son':['H1121 - ben','Son.','Son.'],'sons':['H1121 - ben','Sons.','Sons.'],'daughters':['H1323 - bath','Daughters.','Daughters.'],
'name':['H8034 - shem','Name.','Name.'],'called':["H7121 - qara'",'Called.','Called.'],'after':['Preposition','After.','After.'],
'adam':["H120 - 'adam",'Adam.','Adam.'],'seth':['H8352 - Sheth','Seth.','Seth.'],'enos':["H583 - 'Enowsh",'Enos.','Enos.'],
'cainan':['H7018 - Qeynan','Cainan.','Cainan.'],'mahalaleel':["H4111 - Mahalal'el",'Mahalaleel.','Mahalaleel.'],
'jared':['H3382 - Yered','Jared.','Jared.'],'enoch':['H2585 - Chanowk','Enoch.','Enoch.'],
'methuselah':['H4968 - M@thuwshelach','Methuselah.','Methuselah.'],'lamech':['H3929 - Lemek','Lamech.','Lamech.'],
'noah':['H5146 - Noach','Noah.','Noah.'],'shem':['H8035 - Shem','Shem.','Shem.'],'ham':['H2526 - Cham','Ham.','Ham.'],
'japheth':['H3315 - Yepheth','Japheth.','Japheth.'],'god':["H430 - 'elohiym",'God.','God.'],
'lord':['H3068 - Y@hovah','Jehovah.','LORD.'],'walked':['H1980 - halak','Walked.','Walked.'],'with':['Preposition','With.','With.'],
'not':["H369 - 'ayin",'Was not.','Not.'],'for':['H3588 - kiy','For.','For.'],'took':['H3947 - laqach','Took.','Took.'],
'book':['H5612 - cepher','Book.','Book.'],'generations':['H8435 - towl@dah','Generations.','Generations.'],
'created':["H1254 - bara'",'Created.','Created.'],'man':["H120 - 'adam",'Man.','Man.'],'made':["H6213 - 'asah",'Made.','Made.'],
'likeness':['H1823 - d@muwth','Likeness.','Likeness.'],'image':['H6754 - tselem','Image.','Image.'],
'male':['H2145 - zakar','Male.','Male.'],'female':['H5347 - n@qebah','Female.','Female.'],
'blessed':['H1288 - barak','Blessed.','Blessed.'],'their':['Possessive','Their.','Their.'],'when':['Relative','When.','When.'],
'own':['Emphatic','Own.','Own.'],'that':['Relative','That.','That.'],'which':["H834 - 'asher",'Which.','Which.'],
'saying':["H559 - 'amar",'Saying.','Saying.'],'same':['Pronoun','Same.','Same.'],'shall':['Modal','Shall.','Shall.'],
'comfort':['H5162 - nacham','Comfort.','Comfort.'],'us':['Pronoun','Us.','Us.'],'concerning':['Preposition','Concerning.','Concerning.'],
'our':['Possessive','Our.','Our.'],'work':["H4639 - ma`aseh",'Work.','Work.'],'toil':["H6093 - `itstsabown",'Toil.','Toil.'],
'hands':['H3027 - yad','Hands.','Hands.'],'because':['Preposition','Because.','Because.'],'ground':["H127 - 'adamah",'Ground.','Ground.'],
'hath':['Perfect','Has.','Hath.'],'cursed':["H779 - 'arar",'Cursed.','Cursed.'],'old':['H1121 - ben','Old.','Old.'],
'hundred':["H3967 - me'ah",'Hundred.','Hundred.'],'thirty':['H7970 - sh@lowshiym','Thirty.','Thirty.'],
'nine':['H8672 - tesha`','Nine.','Nine.'],'eight':['H8083 - sh@moneh','Eight.','Eight.'],'seven':['H7651 - sheba`','Seven.','Seven.'],
'six':['H8337 - shesh','Six.','Six.'],'five':['H2568 - chamesh','Five.','Five.'],'four':["H702 - 'arba`",'Four.','Four.'],
'two':['H8147 - sh@nayim','Two.','Two.'],'sixty':['H8346 - shishshiym','Sixty.','Sixty.'],'seventy':['H7657 - shib`iym','Seventy.','Seventy.'],
'eighty':['H8084 - sh@moniym','Eighty.','Eighty.'],'ninety':['H8673 - tish`iym','Ninety.','Ninety.'],
'forty':["H705 - 'arba`iym",'Forty.','Forty.'],'fifty':['H2572 - chamishshiym','Fifty.','Fifty.'],
'twelve':['H8147+H6240','Twelve.','Twelve.'],'fifteen':['H2568+H6240','Fifteen.','Fifteen.'],'ten':['H6235 - `eser','Ten.','Ten.'],
'had':['Perfect','Had.','Had.'],'begotten':['H3205 - yalad','Begotten.','Begotten.']
};
function makeWords(text){
  return text.replace(/[.,:;?!]/g,'').split(/\s+/).filter(Boolean).map(wd=>{
    const key=wd.toLowerCase();
    if(dict[key]) return w(wd,dict[key][0],dict[key][1],dict[key][2]);
    if(/^\d+$/.test(wd)) return w(wd,'Number','Number.','Number.');
    return w(wd,'—','—',wd+'.');
  });
}
const data=[
["Genesis 5:1","This is the book of the generations of Adam. In the day that God created man, in the likeness of God made he him;"],
["Genesis 5:2","Male and female created he them; and blessed them, and called their name Adam, in the day when they were created."],
["Genesis 5:3","And Adam lived an hundred and thirty years, and begat a son in his own likeness, after his image; and called his name Seth:"],
["Genesis 5:4","And the days of Adam after he had begotten Seth were eight hundred years: and he begat sons and daughters:"],
["Genesis 5:5","And all the days that Adam lived were nine hundred and thirty years: and he died."],
["Genesis 5:6","And Seth lived an hundred and five years, and begat Enos:"],
["Genesis 5:7","And Seth lived after he begat Enos eight hundred and seven years, and begat sons and daughters:"],
["Genesis 5:8","And all the days of Seth were nine hundred and twelve years: and he died."],
["Genesis 5:9","And Enos lived ninety years, and begat Cainan:"],
["Genesis 5:10","And Enos lived after he begat Cainan eight hundred and fifteen years, and begat sons and daughters:"],
["Genesis 5:11","And all the days of Enos were nine hundred and five years: and he died."],
["Genesis 5:12","And Cainan lived seventy years, and begat Mahalaleel:"],
["Genesis 5:13","And Cainan lived after he begat Mahalaleel eight hundred and forty years, and begat sons and daughters:"],
["Genesis 5:14","And all the days of Cainan were nine hundred and ten years: and he died."],
["Genesis 5:15","And Mahalaleel lived sixty and five years, and begat Jared:"],
["Genesis 5:16","And Mahalaleel lived after he begat Jared eight hundred and thirty years, and begat sons and daughters:"],
["Genesis 5:17","And all the days of Mahalaleel were eight hundred ninety and five years: and he died."],
["Genesis 5:18","And Jared lived an hundred sixty and two years, and he begat Enoch:"],
["Genesis 5:19","And Jared lived after he begat Enoch eight hundred years, and begat sons and daughters:"],
["Genesis 5:20","And all the days of Jared were nine hundred sixty and two years: and he died."],
["Genesis 5:21","And Enoch lived sixty and five years, and begat Methuselah:"],
["Genesis 5:22","And Enoch walked with God after he begat Methuselah three hundred years, and begat sons and daughters:"],
["Genesis 5:23","And all the days of Enoch were three hundred sixty and five years:"],
["Genesis 5:24","And Enoch walked with God: and he was not; for God took him."],
["Genesis 5:25","And Methuselah lived an hundred eighty and seven years, and begat Lamech:"],
["Genesis 5:26","And Methuselah lived after he begat Lamech seven hundred eighty and two years, and begat sons and daughters:"],
["Genesis 5:27","And all the days of Methuselah were nine hundred sixty and nine years: and he died."],
["Genesis 5:28","And Lamech lived an hundred eighty and two years, and begat a son:"],
["Genesis 5:29","And he called his name Noah, saying, This same shall comfort us concerning our work and toil of our hands, because of the ground which the LORD hath cursed."],
["Genesis 5:30","And Lamech lived after he begat Noah five hundred ninety and five years, and begat sons and daughters:"],
["Genesis 5:31","And all the days of Lamech were seven hundred seventy and seven years: and he died."],
["Genesis 5:32","And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth."]
];
const verses=data.map(([ref,text])=>({ref,text,words:makeWords(text)}));
const versesDiv=document.getElementById('verses');
verses.forEach((verse,index)=>{
const verseDiv=document.createElement('div');
verseDiv.className='verse';
let wordsHTML='';
verse.words.forEach(item=>{wordsHTML+=`<div class="word-block"><div class="word-title">${item.word}</div><span class="def-label">Strong's:</span><div>${item.strongs}</div><span class="def-label">Vine's:</span><div>${item.vines}</div><span class="def-label">Webster's 1828:</span><div>${item.webster}</div></div>`});
verseDiv.innerHTML=`<strong>${verse.ref}</strong><div class="verse-text">${verse.text}</div><div class="verse-menu" id="menu-${index}">${wordsHTML}<p style="margin-top:18px;"><strong>My Notes:</strong></p><textarea placeholder="Write your notes here..." onblur="saveNote('${verse.ref}', this.value)">${localStorage.getItem('note-'+verse.ref)||''}</textarea></div>`;
verseDiv.onclick=function(e){if(e.target.tagName==='TEXTAREA')return;const menu=document.getElementById('menu-'+index);menu.style.display=menu.style.display==='block'?'none':'block'};
versesDiv.appendChild(verseDiv)});
function saveNote(r,t){if(t.trim()==='')localStorage.removeItem('note-'+r);else localStorage.setItem('note-'+r,t)}
</script>
</body>
</html>
