<body>

                w("he","Pronoun","He.","He."), w("died","H4191 - muwth","Died.","Died.")
            ]},
            { ref:"Genesis 5:21", text:"And Enoch lived sixty and five years, and begat Methuselah:", words:[
                w("And","Conjunction","And.","And."), w("Enoch","H2585 - Chanowk","Enoch.","Enoch."),
                w("lived","H2421 - chayah","Lived.","Lived."), w("sixty","H8346 - shishshiym","Sixty.","Sixty."),
                w("and","Conjunction","And.","And."), w("five","H2568 - chamesh","Five.","Five."),
                w("years","H8141 - shaneh","Years.","Years."), w("and","Conjunction","And.","And."),
                w("begat","H3205 - yalad","Begat.","Begat."), w("Methuselah","H4968 - M@thuwshelach","Methuselah.","Methuselah.")
            ]},
            { ref:"Genesis 5:22", text:"And Enoch walked with God after he begat Methuselah three hundred years, and begat sons and daughters:", words:[
                w("And","Conjunction","And.","And."), w("Enoch","H2585 - Chanowk","Enoch.","Enoch."),
                w("walked","H1980 - halak","Walked.","Walked."), w("with","Preposition","With.","With."),
                w("God","H430 - 'elohiym","God.","God."), w("after","Preposition","After.","After."),
                w("he","Pronoun","He.","He."), w("begat","H3205 - yalad","Begat.","Begat."),
                w("Methuselah","H4968 - M@thuwshelach","Methuselah.","Methuselah."), w("three","H7969 - shalowsh","Three.","Three."),
                w("hundred","H3967 - me'ah","Hundred.","Hundred."), w("years","H8141 - shaneh","Years.","Years."),
                w("and","Conjunction","And.","And."), w("begat","H3205 - yalad","Begat.","Begat."),

                w("daughters","H1323 - bath","Daughters.","Daughters.")

            { ref:"Genesis 5:24", text:"And Enoch walked with God: and he was not; for God took him.", words:[

                w("he","Pronoun","He.","He."), w("died","H4191 - muwth","Died.","Died.")
            ]},
            { ref:"Genesis 5:29", text:"And he called his name Noah, saying, This same shall comfort us concerning our work and toil of our hands, because of the ground which the LORD hath cursed.", words:[
                w("And","Conjunction","And.","And."), w("he","Pronoun","Lamech.","He."),
                w("called","H7121 - qara'","Called.","Called."), w("his","Possessive","His.","His."),
                w("name","H8034 - shem","Name.","Name."), w("Noah","H5146 - Noach","Noah.","Noah."),
                w("saying","H559 - 'amar","Saying.","Saying."), w("This","Demonstrative","This.","This."),
                w("same","Pronoun","Same.","Same."), w("shall","Modal","Shall.","Shall."),
                w("comfort","H5162 - nacham","Comfort / relieve.","Comfort."), w("us","Pronoun","Us.","Us."),
                w("concerning","Preposition","Concerning.","Concerning."), w("our","Possessive","Our.","Our."),
                w("work","H4639 - ma`aseh","Work.","Work."), w("and","Conjunction","And.","And."),
                w("toil","H6093 - `itstsabown","Toil.","Toil."), w("of","Preposition","Of.","Of."),

            { ref:"Genesis 5:32", text:"And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth.", words:[

                w("was","Implied","Was.","Was."), w("five","H2568 - chamesh","Five.","Five."),
                w("hundred","H3967 - me'ah","Hundred.","Hundred."), w("years","H8141 - shaneh","Years.","Years."),
                w("old","H1121 - ben","Old (son of).","Old."), w("and","Conjunction","And.","And."),
                w("Noah","H5146 - Noach","Noah.","Noah."), w("begat","H3205 - yalad","Begat.","Begat."),
                w("Shem","H8035 - Shem","Shem.","Shem."), w("Ham","H2526 - Cham","Ham.","Ham."),
                w("and","Conjunction","And.","And."), w("Japheth","H3315 - Yepheth","Japheth.","Japheth.")
            ]}
        ];

        const versesDiv = document.getElementById('verses');
        verses.forEach((verse, index) => {
            const verseDiv = document.createElement('div');
            verseDiv.className = 'verse';
            let wordsHTML = '';
            verse.words.forEach(item => {
                wordsHTML += `<div class="word-block"><div class="word-title">${item.word}</div><span class="def-label">Strong's:</span><div>${item.strongs}</div><span class="def-label">Vine's:</span><div>${item.vines}</div><span class="def-label">Webster's 1828:</span><div>${item.webster}</div></div>`;
            });
            verseDiv.innerHTML = `<strong>${verse.ref}</strong><div class="verse-text">${verse.text}</div><div class="verse-menu" id="menu-${index}">${wordsHTML}<p style="margin-top:18px;"><strong>My Notes:</strong></p><textarea placeholder="Write your notes here..." onblur="saveNote('${verse.ref}', this.value)">${localStorage.getItem('note-' + verse.ref) || ''}</textarea></div>`;
            verseDiv.onclick = function(e) {
                if (e.target.tagName === 'TEXTAREA') return;
                const menu = document.getElementById('menu-' + index);
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            };
            versesDiv.appendChild(verseDiv);
        });
        function saveNote(reference, text) {
            if (text.trim() === '') localStorage.removeItem('note-' + reference);
            else localStorage.setItem('note-' + reference, text);
        }
    </script>
</body>
</html>
