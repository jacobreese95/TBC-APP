{ref:"Genesis 13:14",text:"And the LORD said unto Abram, after that Lot was separated from him, Lift up now thine eyes, and look from the place where thou art northward, and southward, and eastward, and westward:",words:[w("And","Conjunction","And.","And."),w("the","Article","The.","The."),w("LORD","H3068 - Y@hovah","Jehovah.","LORD."),w("said","H559 - 'amar","Said.","Said."),w("unto","H413 - 'el","To.","Unto."),w("Abram","H87 - 'Abram","Abram.","Abram."),w("after","Preposition","After.","After."),w("that","Relative","That.","That."),w("Lot","H3876 - Lowt","Lot.","Lot."),w("was","Implied","Was.","Was."),w("separated","H6504 - parad","Separated.","Separated."),w("from","Preposition","From.","From."),w("him","Pronoun","Him.","Him."),w("Lift","H5375 - nasa'","Lift.","Lift."),w("up","Part of nasa'","Up.","Up."),w("now","H4994 - na'","Now.","Now."),w("thine","Possessive","Your.","Thine."),w("eyes","H5869 - `ayin","Eyes.","Eyes."),w("and","Conjunction","And.","And."),w("look","H7200 - ra'ah","Look.","Look."),w("from","Preposition","From.","From."),w("the","Article","The.","The."),w("place","H4725 - maqowm","Place.","Place."),w("where","Relative","Where.","Where."),w("thou","Pronoun","You.","Thou."),w("art","Verb","Are.","Art."),w("northward","H6828 - tsaphown","Northward.","Northward."),w("and","Conjunction","And.","And."),w("southward","H5045 - negeb","Southward.","Southward."),w("and","Conjunction","And.","And."),w("eastward","H6924 - qedem","Eastward.","Eastward."),w("and","Conjunction","And.","And."),w("westward","H3220 - yam","Westward.","Westward.")]},
