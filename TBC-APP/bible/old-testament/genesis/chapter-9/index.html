const data=[
["Genesis 9:1","And God blessed Noah and his sons, and said unto them, Be fruitful, and multiply, and replenish the earth."],
["Genesis 9:2","And the fear of you and the dread of you shall be upon every beast of the earth, and upon every fowl of the air, upon all that moveth upon the earth, and upon all the fishes of the sea; into your hand are they delivered."],
["Genesis 9:3","Every moving thing that liveth shall be meat for you; even as the green herb have I given you all things."],
["Genesis 9:4","But flesh with the life thereof, which is the blood thereof, shall ye not eat."],
["Genesis 9:5","And surely your blood of your lives will I require; at the hand of every beast will I require it, and at the hand of man; at the hand of every man's brother will I require the life of man."],
["Genesis 9:6","Whoso sheddeth man's blood, by man shall his blood be shed: for in the image of God made he man."],
["Genesis 9:7","And you, be ye fruitful, and multiply; bring forth abundantly in the earth, and multiply therein."],

["Genesis 9:18","And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham is the father of Canaan."],
["Genesis 9:19","These are the three sons of Noah: and of them was the whole earth overspread."],

];
const verses=data.map(([ref,text])=>({ref,text,words:makeWords(text)}));
const root=document.getElementById('verses');
verses.forEach((v,i)=>{const d=document.createElement('div');d.className='verse';let h='';v.words.forEach(x=>{h+=`<div class="word-block"><div class="word-title">${x.word}</div><span class="def-label">Strong's:</span><div>${x.strongs}</div><span class="def-label">Vine's:</span><div>${x.vines}</div><span class="def-label">Webster's 1828:</span><div>${x.webster}</div></div>`});d.innerHTML=`<strong>${v.ref}</strong><div class="verse-text">${v.text}</div><div class="verse-menu" id="menu-${i}">${h}<p style="margin-top:18px;"><strong>My Notes:</strong></p><textarea placeholder="Write your notes here..." onblur="saveNote('${v.ref}',this.value)">${localStorage.getItem('note-'+v.ref)||''}</textarea></div>`;d.onclick=function(e){if(e.target.tagName==='TEXTAREA')return;const m=document.getElementById('menu-'+i);m.style.display=m.style.display==='block'?'none':'block'};root.appendChild(d)});
function saveNote(r,t){if(t.trim()==='')localStorage.removeItem('note-'+r);else localStorage.setItem('note-'+r,t)}
</script>
