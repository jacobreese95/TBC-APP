            { ref:"Genesis 6:14", text:"Make thee an ark of gopher wood; rooms shalt thou make in the ark, and shalt pitch it within and without with pitch.", words:[

                w("heaven","H8064 - shamayim","Heaven.","Heaven."), w("and","Conjunction","And.","And."),

        ];

        const versesDiv = document.getElementById('verses');
        verses.forEach((verse, index) => {
            const verseDiv = document.createElement('div');
            verseDiv.className = 'verse';
            let wordsHTML = '';
            verse.words.forEach(item => {
                wordsHTML += `<div class="word-block"><div class="word-title">${item.word}</div><span class="def-label">Strong's:</span><div>${item.strongs}</div><span class="def-label">Vine's:</span><div>${item.vines}</div><span class="def-label">Webster's 1828:</span><div>${item.webster}</div></div>`;
            });
            verseDiv.innerHTML = `<strong>${verse.ref}</strong><div class="verse-text">${verse.text}</div><div class="verse-menu" id="menu-${index}">${wordsHTML}<p style="margin-top:18px;"><strong>My Notes:</strong></p><textarea placeholder="Write your notes here..." onblur="saveNote('${verse.ref}', this.value)">${localStorage.getItem('note-' + verse.ref) || ''}</textarea></div>`;
            verseDiv.onclick = function(e) {
                if (e.target.tagName === 'TEXTAREA') return;
                const menu = document.getElementById('menu-' + index);
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            };
            versesDiv.appendChild(verseDiv);
        });
        function saveNote(reference, text) {
            if (text.trim() === '') localStorage.removeItem('note-' + reference);
            else localStorage.setItem('note-' + reference, text);
        }
    </script>
</body>
</html>
