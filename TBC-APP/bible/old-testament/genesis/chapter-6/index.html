<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis 6 - TBC Bible</title>
<link rel="stylesheet" href="../../../style.css">
<style>.word-block{background:#f8f8f8;border-left:4px solid #1a3a5c;padding:12px 15px;margin:10px 0;border-radius:6px}.word-title{font-size:1.2rem;font-weight:bold;color:#1a3a5c;margin-bottom:8px}.def-label{font-weight:bold;color:#333;margin-top:8px;display:block}.verse-text{font-size:1.15rem;line-height:1.6;margin-bottom:8px}</style>
</head>
<body>
<header><h1>Genesis Chapter 6</h1></header>
<div class="container">
<button class="back-btn" onclick="window.location.href='../index.html'">← Back to Genesis</button>
<div id="verses"></div>
</div>
<script>
function w(word,strongs,vines,webster){return{word,strongs,vines,webster}}
function makeWords(text){
const d={'and':['Conjunction','And.','And.'],'the':['Article','The.','The.'],'of':['Preposition','Of.','Of.'],'a':['Article','A.','A.'],'god':["H430 - 'elohiym",'God.','God.'],'lord':['H3068 - Y@hovah','Jehovah.','LORD.'],'noah':['H5146 - Noach','Noah.','Noah.'],'man':["H120 - 'adam",'Man.','Man.'],'earth':["H776 - 'erets",'Earth.','Earth.'],'ark':['H8392 - tebah','Ark.','Ark.'],'flood':['H3999 - mabbuwl','Flood.','Flood.'],'flesh':['H1320 - basar','Flesh.','Flesh.'],'waters':['H4325 - mayim','Waters.','Waters.'],'sons':['H1121 - ben','Sons.','Sons.'],'grace':['H2580 - chen','Grace.','Grace.'],'covenant':['H1285 - b@riyth','Covenant.','Covenant.']};
return text.replace(/[.,:;?!]/g,'').split(/\s+/).filter(Boolean).map(wd=>{const k=wd.toLowerCase();if(d[k])return w(wd,d[k][0],d[k][1],d[k][2]);return w(wd,'—','—',wd+'.');});
}
const data=[
["Genesis 6:1","And it came to pass, when men began to multiply on the face of the earth, and daughters were born unto them,"],
["Genesis 6:2","That the sons of God saw the daughters of men that they were fair; and they took them wives of all which they chose."],
["Genesis 6:3","And the LORD said, My spirit shall not always strive with man, for that he also is flesh: yet his days shall be an hundred and twenty years."],
["Genesis 6:4","There were giants in the earth in those days; and also after that, when the sons of God came in unto the daughters of men, and they bare children to them, the same became mighty men which were of old, men of renown."],
["Genesis 6:5","And GOD saw that the wickedness of man was great in the earth, and that every imagination of the thoughts of his heart was only evil continually."],
["Genesis 6:6","And it repented the LORD that he had made man on the earth, and it grieved him at his heart."],
["Genesis 6:7","And the LORD said, I will destroy man whom I have created from the face of the earth; both man, and beast, and the creeping thing, and the fowls of the air; for it repenteth me that I have made them."],
["Genesis 6:8","But Noah found grace in the eyes of the LORD."],
["Genesis 6:9","These are the generations of Noah: Noah was a just man and perfect in his generations, and Noah walked with God."],
["Genesis 6:10","And Noah begat three sons, Shem, Ham, and Japheth."],
["Genesis 6:11","The earth also was corrupt before God, and the earth was filled with violence."],
["Genesis 6:12","And God looked upon the earth, and, behold, it was corrupt; for all flesh had corrupted his way upon the earth."],
["Genesis 6:13","And God said unto Noah, The end of all flesh is come before me; for the earth is filled with violence through them; and, behold, I will destroy them with the earth."],
["Genesis 6:14","Make thee an ark of gopher wood; rooms shalt thou make in the ark, and shalt pitch it within and without with pitch."],
["Genesis 6:15","And this is the fashion which thou shalt make it of: The length of the ark shall be three hundred cubits, the breadth of it fifty cubits, and the height of it thirty cubits."],
["Genesis 6:16","A window shalt thou make to the ark, and in a cubit shalt thou finish it above; and the door of the ark shalt thou set in the side thereof; with lower, second, and third stories shalt thou make it."],
["Genesis 6:17","And, behold, I, even I, do bring a flood of waters upon the earth, to destroy all flesh, wherein is the breath of life, from under heaven; and every thing that is in the earth shall die."],
["Genesis 6:18","But with thee will I establish my covenant; and thou shalt come into the ark, thou, and thy sons, and thy wife, and thy sons' wives with thee."],
["Genesis 6:19","And of every living thing of all flesh, two of every sort shalt thou bring into the ark, to keep them alive with thee; they shall be male and female."],
["Genesis 6:20","Of fowls after their kind, and of cattle after their kind, of every creeping thing of the earth after his kind, two of every sort shall come unto thee, to keep them alive."],
["Genesis 6:21","And take thou unto thee of all food that is eaten, and thou shalt gather it to thee; and it shall be for food for thee, and for them."],
["Genesis 6:22","Thus did Noah; according to all that God commanded him, so did he."]
];
const verses=data.map(([ref,text])=>({ref,text,words:makeWords(text)}));
const root=document.getElementById('verses');
verses.forEach((v,i)=>{const d=document.createElement('div');d.className='verse';let h='';v.words.forEach(x=>{h+=`<div class="word-block"><div class="word-title">${x.word}</div><span class="def-label">Strong's:</span><div>${x.strongs}</div><span class="def-label">Vine's:</span><div>${x.vines}</div><span class="def-label">Webster's 1828:</span><div>${x.webster}</div></div>`});d.innerHTML=`<strong>${v.ref}</strong><div class="verse-text">${v.text}</div><div class="verse-menu" id="menu-${i}">${h}<p style="margin-top:18px;"><strong>My Notes:</strong></p><textarea placeholder="Write your notes here..." onblur="saveNote('${v.ref}',this.value)">${localStorage.getItem('note-'+v.ref)||''}</textarea></div>`;d.onclick=function(e){if(e.target.tagName==='TEXTAREA')return;const m=document.getElementById('menu-'+i);m.style.display=m.style.display==='block'?'none':'block'};root.appendChild(d)});
function saveNote(r,t){if(t.trim()==='')localStorage.removeItem('note-'+r);else localStorage.setItem('note-'+r,t)}
</script>
</body>
</html>
