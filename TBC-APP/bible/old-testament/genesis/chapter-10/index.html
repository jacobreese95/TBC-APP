<header><h1>Genesis Chapter 10</h1></header>
<div class="container">
<button class="back-btn" onclick="window.location.href='../index.html'">← Back to Genesis</button>
<div id="verses"></div>
</div>
<script>
function w(word,strongs,vines,webster){return{word:word,strongs:strongs,vines:vines,webster:webster}}
function makeWords(text){
var d={
"and":["Conjunction","And.","And."],"the":["Article","The.","The."],"of":["Preposition","Of.","Of."],
"a":["Article","A.","A."],"in":["Preposition","In.","In."],"to":["Preposition","To.","To."],
"for":["H3588 - kiy","For.","For."],"with":["Preposition","With.","With."],"from":["Preposition","From.","From."],
"unto":["H413 - el","To.","Unto."],"after":["Preposition","After.","After."],"by":["Preposition","By.","By."],
"he":["Pronoun","He.","He."],"his":["Possessive","His.","His."],"him":["Pronoun","Him.","Him."],
"they":["Pronoun","They.","They."],"them":["Pronoun","Them.","Them."],"their":["Possessive","Their.","Their."],
"these":["Demonstrative","These.","These."],"are":["Implied","Are.","Are."],"was":["Implied","Was.","Was."],
"were":["Implied","Were.","Were."],"is":["Implied","Is.","Is."],"be":["H1961 - hayah","Be.","Be."],
"all":["H3605 - kol","All.","All."],"every":["H3605 - kol","Every.","Every."],"that":["Relative","That.","That."],
"which":["H834 - asher","Which.","Which."],"now":["Conjunction","Now.","Now."],"before":["H6440 - paniym","Before.","Before."],
"even":["Adverb","Even.","Even."],"as":["Preposition","As.","As."],"said":["H559 - amar","Said.","Said."],
"god":["H430 - elohiym","God.","God."],"lord":["H3068 - Yehovah","Jehovah.","LORD."],
"noah":["H5146 - Noach","Noah.","Noah."],"shem":["H8035 - Shem","Shem.","Shem."],"ham":["H2526 - Cham","Ham.","Ham."],
"japheth":["H3315 - Yepheth","Japheth.","Japheth."],"sons":["H1121 - ben","Sons.","Sons."],"son":["H1121 - ben","Son.","Son."],
"born":["H3205 - yalad","Born.","Born."],"begat":["H3205 - yalad","Begat.","Begat."],"flood":["H3999 - mabbuwl","Flood.","Flood."],
"generations":["H8435 - toledah","Generations.","Generations."],"families":["H4940 - mishpachah","Families.","Families."],
"nations":["H1471 - goy","Nations.","Nations."],"earth":["H776 - erets","Earth.","Earth."],"divided":["H6504 - parad","Divided.","Divided."],
"mighty":["H1368 - gibbor","Mighty.","Mighty."],"hunter":["H6718 - tsayid","Hunter.","Hunter."],"began":["H2490 - chalal","Began.","Began."],
"one":["Implied","One.","One."],"cush":["H3568 - Kush","Cush.","Cush."],"nimrod":["H5248 - Nimrod","Nimrod.","Nimrod."],
"children":["H1121 - ben","Children.","Children."],"father":["H1 - ab","Father.","Father."],"brother":["H251 - ach","Brother.","Brother."],
"name":["H8034 - shem","Name.","Name."],"days":["H3117 - yom","Days.","Days."],"land":["H776 - erets","Land.","Land."],
"city":["H5892 - ir","City.","City."],"great":["H1419 - gadol","Great.","Great."],"same":["Demonstrative","Same.","Same."],
"out":["Preposition","Out.","Out."],"went":["H3318 - yatsa","Went.","Went."],"forth":["Part of yatsa","Forth.","Forth."],
"builded":["H1129 - banah","Builded.","Builded."],"came":["H3318 - yatsa","Came.","Came."],"whom":["Relative","Whom.","Whom."],
"firstborn":["H1060 - bekor","Firstborn.","Firstborn."],"afterward":["H310 - achar","Afterward.","Afterward."],
"spread":["H5310 - naphats","Spread.","Spread."],"abroad":["Adverb","Abroad.","Abroad."],"border":["H1366 - gebul","Border.","Border."],
"thou":["Pronoun","You.","Thou."],"comest":["H935 - bo","Comest.","Comest."],"goest":["H935 - bo","Goest.","Goest."],
"tongues":["H3956 - lashon","Tongues.","Tongues."],"tongue":["H3956 - lashon","Tongue.","Tongue."],
"countries":["H776 - erets","Countries.","Countries."],"lands":["H776 - erets","Lands.","Lands."],
"isles":["H339 - iy","Isles.","Isles."],"gentiles":["H1471 - goy","Gentiles.","Gentiles."],
"elder":["H1419 - gadol","Elder.","Elder."],"also":["Adverb","Also.","Also."],"two":["H8147 - shenayim","Two.","Two."],
"because":["H3588 - kiy","Because.","Because."],"dwelling":["H4186 - moshab","Dwelling.","Dwelling."],
"mount":["H2022 - har","Mount.","Mount."],"east":["H6924 - qedem","East.","East."],"between":["H996 - beyn","Between.","Between."]
};
return text.replace(/[.,:;?!()]/g,"").split(/\s+/).filter(Boolean).map(function(wd){
var k=wd.toLowerCase().replace(/'/g,"");
if(d[k])return w(wd,d[k][0],d[k][1],d[k][2]);
return w(wd,"—","—",wd+".");
});
}
var data=[
["Genesis 10:1","Now these are the generations of the sons of Noah, Shem, Ham, and Japheth: and unto them were sons born after the flood."],
["Genesis 10:2","The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras."],
["Genesis 10:3","And the sons of Gomer; Ashkenaz, and Riphath, and Togarmah."],
["Genesis 10:4","And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim."],
["Genesis 10:5","By these were the isles of the Gentiles divided in their lands; every one after his tongue, after their families, in their nations."],
["Genesis 10:6","And the sons of Ham; Cush, and Mizraim, and Phut, and Canaan."],
["Genesis 10:7","And the sons of Cush; Seba, and Havilah, and Sabtah, and Raamah, and Sabtechah: and the sons of Raamah; Sheba, and Dedan."],
["Genesis 10:8","And Cush begat Nimrod: he began to be a mighty one in the earth."],
["Genesis 10:9","He was a mighty hunter before the LORD: wherefore it is said, Even as Nimrod the mighty hunter before the LORD."],
["Genesis 10:10","And the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar."],
["Genesis 10:11","Out of that land went forth Asshur, and builded Nineveh, and the city Rehoboth, and Calah,"],
["Genesis 10:12","And Resen between Nineveh and Calah: the same is a great city."],
["Genesis 10:13","And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,"],
["Genesis 10:14","And Pathrusim, and Casluhim, (out of whom came Philistim,) and Caphtorim."],
["Genesis 10:15","And Canaan begat Sidon his firstborn, and Heth,"],
["Genesis 10:16","And the Jebusite, and the Amorite, and the Girgasite,"],
["Genesis 10:17","And the Hivite, and the Arkite, and the Sinite,"],
["Genesis 10:18","And the Arvadite, and the Zemarite, and the Hamathite: and afterward were the families of the Canaanites spread abroad."],
["Genesis 10:19","And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha."],
["Genesis 10:20","These are the sons of Ham, after their families, after their tongues, in their countries, and in their nations."],
["Genesis 10:21","Unto Shem also, the father of all the children of Eber, the brother of Japheth the elder, even to him were children born."],
["Genesis 10:22","The children of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram."],
["Genesis 10:23","And the children of Aram; Uz, and Hul, and Gether, and Mash."],
["Genesis 10:24","And Arphaxad begat Salah; and Salah begat Eber."],
["Genesis 10:25","And unto Eber were born two sons: the name of one was Peleg; for in his days was the earth divided; and his brother's name was Joktan."],
["Genesis 10:26","And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,"],
["Genesis 10:27","And Hadoram, and Uzal, and Diklah,"],
["Genesis 10:28","And Obal, and Abimael, and Sheba,"],
["Genesis 10:29","And Ophir, and Havilah, and Jobab: all these were the sons of Joktan."],
["Genesis 10:30","And their dwelling was from Mesha, as thou goest unto Sephar a mount of the east."],
["Genesis 10:31","These are the sons of Shem, after their families, after their tongues, in their lands, after their nations."],
["Genesis 10:32","These are the families of the sons of Noah, after their generations, in their nations: and by these were the nations divided in the earth after the flood."]
];
var verses=data.map(function(pair){return{ref:pair[0],text:pair[1],words:makeWords(pair[1])};});
var root=document.getElementById("verses");
verses.forEach(function(v,i){
var d=document.createElement("div");
d.className="verse";
var h="";
v.words.forEach(function(x){
h+="<div class=\"word-block\"><div class=\"word-title\">"+x.word+"</div><span class=\"def-label\">Strong's:</span><div>"+x.strongs+"</div><span class=\"def-label\">Vine's:</span><div>"+x.vines+"</div><span class=\"def-label\">Webster's 1828:</span><div>"+x.webster+"</div></div>";
});
var note=localStorage.getItem("note-"+v.ref)||"";
d.innerHTML="<strong>"+v.ref+"</strong><div class=\"verse-text\">"+v.text+"</div><div class=\"verse-menu\" id=\"menu-"+i+"\">"+h+"<p style=\"margin-top:18px;\"><strong>My Notes:</strong></p><textarea placeholder=\"Write your notes here...\" onblur=\"saveNote('"+v.ref+"',this.value)\">"+note+"</textarea></div>";
d.onclick=function(e){if(e.target.tagName==="TEXTAREA")return;var m=document.getElementById("menu-"+i);m.style.display=m.style.display==="block"?"none":"block";};
root.appendChild(d);
});
function saveNote(r,t){if(t.trim()==="")localStorage.removeItem("note-"+r);else localStorage.setItem("note-"+r,t);}
</script>
