<!DOCTYPE html>
<html lang="en">
<head>

    <title>Genesis 1 - TBC Bible</title>
    <link rel="stylesheet" href="../../../style.css">
    <style>
        .word-block {
            background: #f8f8f8;
            border-left: 4px solid #1a3a5c;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 6px;
        }
        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1a3a5c;
            margin-bottom: 8px;
        }
        .def-label {
            font-weight: bold;
            color: #333;
            margin-top: 8px;
            display: block;
        }
        .verse-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Genesis Chapter 1</h1>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='../index.html'">← Back to Genesis</button>

                    { word: "of", strongs: "Preposition", vines: "Relation.", webster: "Belonging to." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the waters.", webster: "Definite article." },
                    { word: "waters", strongs: "H4325 - mayim (water, waters)", vines: "The waters that covered the earth.", webster: "The fluid that descends from the clouds as rain." }

                ]
            },
            {
                ref: "Genesis 1:4",
                text: "And God saw the light, that it was good: and God divided the light from the darkness.",
                words: [
                    { word: "And", strongs: "Conjunction (waw)", vines: "Continues the narrative.", webster: "Connecting word." },
                    { word: "God", strongs: "H430 - 'elohiym", vines: "The supreme God.", webster: "The Supreme Being." },
                    { word: "saw", strongs: "H7200 - ra'ah (to see, look, behold)", vines: "To perceive with the eyes or mind.", webster: "To perceive by the eye." },
                    { word: "the", strongs: "H853 - 'eth (direct object marker)", vines: "Marks the definite object.", webster: "Definite article." },
                    { word: "light", strongs: "H216 - 'owr", vines: "The light that was created.", webster: "Illumination." },
                    { word: "that", strongs: "H3588 - kiy (that, for, because)", vines: "Introduces the clause of evaluation.", webster: "Introducing a clause." },
                    { word: "it", strongs: "Pronoun", vines: "Refers to the light.", webster: "Refers to a previously mentioned thing." },
                    { word: "was", strongs: "Implied from context", vines: "Existed as.", webster: "Existed." },
                    { word: "good", strongs: "H2896 - towb (good, pleasant, agreeable)", vines: "Pleasant, agreeable, or beneficial.", webster: "Having desirable qualities; beneficial." },
                    { word: "and", strongs: "Conjunction", vines: "Connects the next action.", webster: "Connecting word." },
                    { word: "God", strongs: "H430 - 'elohiym", vines: "The supreme God.", webster: "The Supreme Being." },
                    { word: "divided", strongs: "H914 - badal (to divide, separate)", vines: "To separate or make a distinction.", webster: "To part or separate." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the light.", webster: "Definite article." },
                    { word: "light", strongs: "H216 - 'owr", vines: "The light.", webster: "Illumination." },
                    { word: "from", strongs: "H996 - beyn (between, from)", vines: "Indicates separation.", webster: "Indicating separation or distinction." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the darkness.", webster: "Definite article." },
                    { word: "darkness", strongs: "H2822 - choshek", vines: "Absence of light.", webster: "Absence of light." }
                ]
            },
            {
                ref: "Genesis 1:5",
                text: "And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.",
                words: [
                    { word: "And", strongs: "Conjunction", vines: "Continues.", webster: "Connecting word." },
                    { word: "God", strongs: "H430 - 'elohiym", vines: "The supreme God.", webster: "The Supreme Being." },
                    { word: "called", strongs: "H7121 - qara' (to call, name, proclaim)", vines: "To name or summon.", webster: "To name; to give a name to." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the light.", webster: "Definite article." },
                    { word: "light", strongs: "H216 - 'owr", vines: "The light.", webster: "Illumination." },
                    { word: "Day", strongs: "H3117 - yowm (day, time, year)", vines: "A period of light; also used of a longer period.", webster: "The time between sunrise and sunset." },
                    { word: "and", strongs: "Conjunction", vines: "Connects.", webster: "Connecting word." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the darkness.", webster: "Definite article." },
                    { word: "darkness", strongs: "H2822 - choshek", vines: "Absence of light.", webster: "Absence of light." },
                    { word: "he", strongs: "Pronoun referring to God", vines: "God is the subject.", webster: "Refers to God." },
                    { word: "called", strongs: "H7121 - qara'", vines: "To name.", webster: "To name." },
                    { word: "Night", strongs: "H3915 - layil (night)", vines: "The period of darkness.", webster: "The time from sunset to sunrise." },
                    { word: "And", strongs: "Conjunction", vines: "Continues.", webster: "Connecting word." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the evening.", webster: "Definite article." },
                    { word: "evening", strongs: "H6153 - 'ereb (evening, night)", vines: "The end of the day.", webster: "The close of the day." },

                    { word: "the", strongs: "Definite article", vines: "Specifies the morning.", webster: "Definite article." },
                    { word: "morning", strongs: "H1242 - boqer (morning, dawn)", vines: "The beginning of the day.", webster: "The first part of the day." },
                    { word: "were", strongs: "H1961 - hayah", vines: "Became / constituted.", webster: "Existed as." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the day.", webster: "Definite article." },
                    { word: "first", strongs: "H259 - 'echad (one, first)", vines: "The first in order.", webster: "Preceding all others." },
                    { word: "day", strongs: "H3117 - yowm", vines: "A day.", webster: "A period of light." }
                ]
            },
            {
                ref: "Genesis 1:6",
                text: "And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.",

                    { word: "God", strongs: "H430 - 'elohiym", vines: "The supreme God.", webster: "The Supreme Being." },
                    { word: "said", strongs: "H559 - 'amar", vines: "To speak or declare.", webster: "To speak; to express in words." },
                    { word: "Let", strongs: "Jussive construction", vines: "Expresses command.", webster: "Allow; permit." },
                    { word: "there", strongs: "Existential", vines: "Indicates existence.", webster: "In that place." },
                    { word: "be", strongs: "H1961 - hayah", vines: "To come into existence.", webster: "To exist." },
                    { word: "a", strongs: "Indefinite article", vines: "Introduces the firmament.", webster: "Indefinite article." },
                    { word: "firmament", strongs: "H7549 - raqiya' (expanse, firmament)", vines: "The expanse of the sky; the solid-looking vault of heaven.", webster: "The sky or heavens; the expanse." },
                    { word: "in", strongs: "Preposition", vines: "Location.", webster: "Within; inside." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the midst.", webster: "Definite article." },
                    { word: "midst", strongs: "H8432 - tavek (midst, middle)", vines: "The middle or center.", webster: "The middle." },
                    { word: "of", strongs: "Preposition", vines: "Relation.", webster: "Belonging to." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the waters.", webster: "Definite article." },
                    { word: "waters", strongs: "H4325 - mayim", vines: "The waters.", webster: "The fluid element." },
                    { word: "and", strongs: "Conjunction", vines: "Connects the purpose.", webster: "Connecting word." },
                    { word: "let", strongs: "Jussive", vines: "Expresses command.", webster: "Allow." },
                    { word: "it", strongs: "Pronoun", vines: "Refers to the firmament.", webster: "Refers to the firmament." },
                    { word: "divide", strongs: "H914 - badal", vines: "To separate or make a distinction.", webster: "To part or separate." },
                    { word: "the", strongs: "Definite article", vines: "Specifies the waters.", webster: "Definite article." },
                    { word: "waters", strongs: "H4325 - mayim", vines: "The waters.", webster: "The fluid element." },

                    { word: "the", strongs: "Definite article", vines: "Specifies the waters.", webster: "Definite article." },
                    { word: "waters", strongs: "H4325 - mayim", vines: "The waters.", webster: "The fluid element." }
                ]
            }
        ];

        const versesDiv = document.getElementById('verses');

        verses.forEach((verse, index) => {
            const verseDiv = document.createElement('div');
            verseDiv.className = 'verse';

            let wordsHTML = '';
            verse.words.forEach(w => {
                wordsHTML += `
                    <div class="word-block">
                        <div class="word-title">${w.word}</div>
                        <span class="def-label">Strong's:</span>
                        <div>${w.strongs}</div>
                        <span class="def-label">Vine's:</span>
                        <div>${w.vines}</div>
                        <span class="def-label">Webster's 1828:</span>
                        <div>${w.webster}</div>
                    </div>
                `;
            });

            verseDiv.innerHTML = `
                <strong>${verse.ref}</strong>
                <div class="verse-text">${verse.text}</div>
                <div class="verse-menu" id="menu-${index}">
                    ${wordsHTML}
                    <p style="margin-top:18px;"><strong>My Notes:</strong></p>
                    <textarea placeholder="Write your notes here..." onblur="saveNote('${verse.ref}', this.value)">${localStorage.getItem('note-' + verse.ref) || ''}</textarea>
                </div>
            `;

            verseDiv.onclick = function(e) {
                if (e.target.tagName === 'TEXTAREA') return;
                const menu = document.getElementById('menu-' + index);
                menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            };

            versesDiv.appendChild(verseDiv);
        });

        function saveNote(reference, text) {
            if (text.trim() === '') {
                localStorage.removeItem('note-' + reference);
            } else {
                localStorage.setItem('note-' + reference, text);
            }
        }
    </script>
</body>
