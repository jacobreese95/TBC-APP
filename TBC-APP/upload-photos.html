<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin-top:60px;">Upload Photos</h2>
        <div class="container" style="max-width:400px; margin:20px auto; text-align:center;">
            <p style="color:#404040; margin-bottom:30px;">Upload photos from church events here. This feature is coming soon.</p>
            <button class="menu-btn" disabled style="background:#7a8fac; opacity:0.6;">Choose Photos (coming soon)</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        auth.onAuthStateChanged(function(user) {
            if (!user) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
