<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Winning - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        .tabs { display: flex; gap: 6px; margin: 12px 0 18px; }
        .tab-btn { flex: 1; padding: 12px 8px; border: none; border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; background: #e8eef2; color: #404040; box-shadow: none; margin: 0; }
        .tab-btn.active { background: linear-gradient(135deg, #4cb8b9 0%, #7bafdd 100%); color: #fff; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: #fff; border: 1px solid rgba(122,143,172,0.35); border-radius: 14px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(64,64,64,0.06); }
        label { display: block; font-weight: 600; font-size: 0.9rem; color: #404040; margin: 12px 0 4px; }
        input, select, textarea { width: 100%; padding: 12px 14px; margin: 0 0 10px; border: 2px solid #7a8fac; border-radius: 14px; font-size: 1rem; background: #fff; color: #404040; box-sizing: border-box; }
        textarea { min-height: 80px; resize: vertical; }
        #map, #mapAdd { height: 320px; border-radius: 14px; border: 2px solid #7a8fac; margin: 10px 0; }
        .lead-item { background: #fff; border: 1px solid rgba(122,143,172,0.35); border-radius: 12px; padding: 14px; margin: 10px 0; }
        .lead-item h3 { margin: 0 0 6px; color: #404040; font-size: 1.05rem; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; color: #fff; }
        .badge.new { background: #4cb8b9; }
        .badge.contacted { background: #7bafdd; }
        .badge.follow-up { background: #e67e22; }
        .badge.saved { background: #27ae60; }
        .badge.not-interested { background: #7a8fac; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #404040; color: #fff; padding: 12px 20px; border-radius: 24px; font-weight: 600; z-index: 3000; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.25); max-width: 90%; text-align: center; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .btn-row button { flex: 1; margin: 0; }
        .btn-secondary { background: linear-gradient(135deg, #7a8fac 0%, #7bafdd 100%) !important; }
        .btn-danger { background: linear-gradient(135deg, #c62828 0%, #e57373 100%) !important; }
        .empty-state { text-align: center; color: #7a8fac; padding: 40px 16px; }
        #editModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 2500; align-items: center; justify-content: center; padding: 16px; }
        #editModal.open { display: flex; }
        #editModal .modal-card { background: #fff; border-radius: 16px; padding: 18px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Soul Winning</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

        <div class="tabs">
            <button class="tab-btn active" data-tab="add" onclick="switchTab('add')">Add Lead</button>
            <button class="tab-btn" data-tab="list" onclick="switchTab('list')">Leads</button>
            <button class="tab-btn" data-tab="map" onclick="switchTab('map')">Map</button>
        </div>

        <div id="panel-add" class="panel active">
            <div class="card">
                <label for="leadName">Name *</label>
                <input type="text" id="leadName" placeholder="Full name" required>

                <label for="leadPhone">Phone</label>
                <input type="tel" id="leadPhone" placeholder="(316) 555-1234">

                <label for="leadAddress">Address</label>
                <input type="text" id="leadAddress" placeholder="Street, City, KS">

                <button type="button" class="btn-secondary menu-btn" style="margin:0 0 10px;" onclick="previewAddress()">Find on Map</button>
                <div id="mapAdd"></div>
                <p style="font-size:0.8rem;color:#7a8fac;margin:0 0 8px;">Tap the map to drop a pin, or use Find on Map after typing an address.</p>

                <label for="leadStatus">Status</label>
                <select id="leadStatus">
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="follow-up">Follow-up</option>
                    <option value="saved">Saved / Decision</option>
                    <option value="not-interested">Not interested</option>
                </select>

                <label for="leadNotes">Notes</label>
                <textarea id="leadNotes" placeholder="Conversation notes, prayer requests…"></textarea>

                <button class="menu-btn" onclick="saveLead()">Save Lead</button>
            </div>
        </div>

        <div id="panel-list" class="panel">
            <div id="leadsList"><div class="empty-state">Loading leads…</div></div>
        </div>

        <div id="panel-map" class="panel">
            <div id="map"></div>
        </div>
    </div>

    <div id="editModal">
        <div class="modal-card">
            <h3 style="margin-top:0;color:#404040;">Edit Lead</h3>
            <input type="hidden" id="editId">
            <label>Name *</label>
            <input type="text" id="editName">
            <label>Phone</label>
            <input type="tel" id="editPhone">
            <label>Address</label>
            <input type="text" id="editAddress">
            <label>Status</label>
            <select id="editStatus">
                <option value="new">New</option>
                <option value="contacted">Contacted</option>
                <option value="follow-up">Follow-up</option>
                <option value="saved">Saved / Decision</option>
                <option value="not-interested">Not interested</option>
            </select>
            <label>Notes</label>
            <textarea id="editNotes"></textarea>
            <div class="btn-row">
                <button class="btn-secondary menu-btn" onclick="closeEditModal()">Cancel</button>
                <button class="menu-btn" onclick="updateLead()">Save</button>
            </div>
            <button class="btn-danger menu-btn" style="margin-top:10px;" onclick="deleteLead()">Delete Lead</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="home-logo.js"></script>
    <script>
        let currentProfile = null;
        let leads = [];
        let map, mapAdd, markersLayer, addMarker;
        let pinLat = null, pinLng = null;
        const TBC = [37.6872, -97.3301];

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2800);
        }

        function switchTab(name) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            if (name === 'map' && map) setTimeout(() => map.invalidateSize(), 50);
            if (name === 'add' && mapAdd) setTimeout(() => mapAdd.invalidateSize(), 50);
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function statusBadge(status) {
            const s = status || 'new';
            const label = ({ 'new':'New','contacted':'Contacted','follow-up':'Follow-up','saved':'Saved','not-interested':'Not interested' })[s] || s;
            return '<span class="badge ' + s + '">' + label + '</span>';
        }

        requireApprovedUser().then(function (profile) {
            if (!profile) return;
            currentProfile = profile;
            initMaps();
            loadLeads();
        });

        function initMaps() {
            mapAdd = L.map('mapAdd').setView(TBC, 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(mapAdd);
            mapAdd.on('click', function (e) {
                pinLat = e.latlng.lat;
                pinLng = e.latlng.lng;
                if (addMarker) mapAdd.removeLayer(addMarker);
                addMarker = L.marker([pinLat, pinLng]).addTo(mapAdd);
            });

            map = L.map('map').setView(TBC, 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        async function geocodeAddress(address) {
            const q = encodeURIComponent(address + ', Wichita, KS');
            try {
                const r = await fetch('https://photon.komoot.io/api/?q=' + q + '&limit=1');
                const data = await r.json();
                if (data.features && data.features.length) {
                    const c = data.features[0].geometry.coordinates;
                    return { lat: c[1], lng: c[0] };
                }
            } catch (e) {}
            try {
                const r2 = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + q, {
                    headers: { 'Accept': 'application/json' }
                });
                const d2 = await r2.json();
                if (d2 && d2.length) return { lat: parseFloat(d2[0].lat), lng: parseFloat(d2[0].lon) };
            } catch (e) {}
            return null;
        }

        async function previewAddress() {
            const address = document.getElementById('leadAddress').value.trim();
            if (!address) { showToast('Enter an address first'); return; }
            showToast('Finding address…');
            const loc = await geocodeAddress(address);
            if (!loc) { showToast('Could not find that address'); return; }
            pinLat = loc.lat; pinLng = loc.lng;
            if (addMarker) mapAdd.removeLayer(addMarker);
            addMarker = L.marker([pinLat, pinLng]).addTo(mapAdd);
            mapAdd.setView([pinLat, pinLng], 16);
            showToast('Pin placed — adjust by tapping the map if needed');
        }

        async function saveLead() {
            const name = document.getElementById('leadName').value.trim();
            if (!name) { showToast('Name is required'); return; }
            const phone = document.getElementById('leadPhone').value.trim();
            const address = document.getElementById('leadAddress').value.trim();
            const status = document.getElementById('leadStatus').value;
            const notes = document.getElementById('leadNotes').value.trim();

            let lat = pinLat, lng = pinLng;
            if ((lat == null || lng == null) && address) {
                const loc = await geocodeAddress(address);
                if (loc) { lat = loc.lat; lng = loc.lng; }
            }

            try {
                await db.collection('soulWinningLeads').add({
                    name: name,
                    phone: phone,
                    address: address,
                    status: status,
                    notes: notes,
                    lat: lat,
                    lng: lng,
                    createdByUid: auth.currentUser.uid,
                    createdByName: currentProfile.name || currentProfile.email || 'Member',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                showToast('Lead saved');
                document.getElementById('leadName').value = '';
                document.getElementById('leadPhone').value = '';
                document.getElementById('leadAddress').value = '';
                document.getElementById('leadNotes').value = '';
                document.getElementById('leadStatus').value = 'new';
                pinLat = pinLng = null;
                if (addMarker) { mapAdd.removeLayer(addMarker); addMarker = null; }
                switchTab('list');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        function loadLeads() {
            db.collection('soulWinningLeads').orderBy('createdAt', 'desc').onSnapshot(function (snap) {
                leads = [];
                snap.forEach(function (doc) { leads.push({ id: doc.id, ...doc.data() }); });
                renderList();
                renderMapMarkers();
            }, function (err) {
                document.getElementById('leadsList').innerHTML = '<div class="empty-state">Error: ' + escapeHtml(err.message) + '</div>';
            });
        }

        function renderList() {
            const el = document.getElementById('leadsList');
            if (!leads.length) {
                el.innerHTML = '<div class="empty-state">No leads yet. Add your first contact!</div>';
                return;
            }
            el.innerHTML = leads.map(function (l) {
                return '<div class="lead-item">' +
                    '<h3>' + escapeHtml(l.name) + ' ' + statusBadge(l.status) + '</h3>' +
                    (l.phone ? '<div>📞 ' + escapeHtml(l.phone) + '</div>' : '') +
                    (l.address ? '<div>📍 ' + escapeHtml(l.address) + '</div>' : '') +
                    (l.notes ? '<div style="margin-top:6px;color:#555;">' + escapeHtml(l.notes) + '</div>' : '') +
                    '<div style="font-size:0.8rem;color:#7a8fac;margin-top:6px;">by ' + escapeHtml(l.createdByName || '') + '</div>' +
                    '<div class="btn-row"><button class="btn-secondary menu-btn" onclick="openEdit(\'' + l.id + '\')">Edit</button></div>' +
                    '</div>';
            }).join('');
        }

        function openEdit(id) {
            const l = leads.find(x => x.id === id);
            if (!l) return;
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = l.name || '';
            document.getElementById('editPhone').value = l.phone || '';
            document.getElementById('editAddress').value = l.address || '';
            document.getElementById('editStatus').value = l.status || 'new';
            document.getElementById('editNotes').value = l.notes || '';
            document.getElementById('editModal').classList.add('open');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
        }

        async function updateLead() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            if (!name) { showToast('Name is required'); return; }
            try {
                await db.collection('soulWinningLeads').doc(id).update({
                    name: name,
                    phone: document.getElementById('editPhone').value.trim(),
                    address: document.getElementById('editAddress').value.trim(),
                    status: document.getElementById('editStatus').value,
                    notes: document.getElementById('editNotes').value.trim()
                });
                closeEditModal();
                showToast('Lead updated');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        async function deleteLead() {
            const id = document.getElementById('editId').value;
            if (!confirm('Delete this lead?')) return;
            try {
                await db.collection('soulWinningLeads').doc(id).delete();
                closeEditModal();
                showToast('Lead deleted');
            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        function renderMapMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            leads.forEach(function (l) {
                if (l.lat == null || l.lng == null) return;
                const marker = L.marker([l.lat, l.lng]);
                marker.bindPopup(
                    '<strong>' + escapeHtml(l.name) + '</strong><br>' +
                    statusBadge(l.status) + '<br>' +
                    (l.address ? escapeHtml(l.address) + '<br>' : '') +
                    '<button onclick="openEdit(\'' + l.id + '\')" style="margin-top:6px;padding:6px 10px;">Edit</button>'
                );
                markersLayer.addLayer(marker);
            });
        }

        document.getElementById('editModal').addEventListener('click', function (e) {
            if (e.target === this) closeEditModal();
        });
    </script>
</body>
</html>
