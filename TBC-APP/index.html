<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .auth-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid rgba(122,143,172,0.25);
      }
      .auth-bar .welcome {
        font-size: 0.95rem;
        color: #404040;
        font-weight: 600;
      }
      .auth-bar button {
        width: auto;
        margin: 0;
        padding: 10px 16px;
        font-size: 0.9rem;
      }
      .auth-bar .login-btn {
        background: linear-gradient(135deg, #4cb8b9 0%, #7bafdd 100%);
      }
      .auth-bar .logout-btn {
        background: linear-gradient(135deg, #7a8fac 0%, #404040 100%);
      }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="#" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank'); toggleMenu(); return false;">View Location on Google Maps</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="login.html" id="drawer-login">Login</a>
    </div>

    <div class="auth-bar" id="authBar">
      <span class="welcome" id="welcomeText">Checking login...</span>
      <button type="button" id="authActionBtn" class="login-btn" onclick="handleAuthAction()">Login</button>
    </div>

    <div class="home-logo-wrap">
        <img src="tbclogo.jpeg" alt="Temple Baptist Church Logo">
    </div>

    <div class="container menu-stack">
        <button class="menu-btn" onclick="window.location.href='calendar.html'">Calendar</button>
        <button class="menu-btn" onclick="window.location.href='chat.html'">Ministry Chats</button>
        <button class="menu-btn" onclick="window.location.href='bible/index.html'">Bible</button>
        <button class="menu-btn" onclick="window.location.href='give.html'">Give on Tithe.ly</button>
        <button class="menu-btn" onclick="window.location.href='sermons.html'">Sermons & Live Streams</button>
        <button class="menu-btn" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank')">View Location on Google Maps</button>
        <button class="menu-btn" onclick="window.location.href='soul-winning.html'">Soul Winning</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        let loggedIn = false;

        function handleAuthAction() {
            if (loggedIn) {
                signOutUser().then(function () {
                    window.location.reload();
                });
            } else {
                window.location.href = 'login.html';
            }
        }

        auth.onAuthStateChanged(async function (user) {
            const welcome = document.getElementById('welcomeText');
            const btn = document.getElementById('authActionBtn');
            const drawerLogin = document.getElementById('drawer-login');

            if (!user) {
                loggedIn = false;
                welcome.textContent = 'Not logged in';
                btn.textContent = 'Login';
                btn.className = 'login-btn';
                drawerLogin.textContent = 'Login';
                drawerLogin.href = 'login.html';
                return;
            }

            try {
                const profile = await ensureUserProfile(user);
                loggedIn = true;
                const name = (profile && profile.name) ? profile.name : (user.email || 'Member');
                if (profile && !profile.approved) {
                    welcome.textContent = name + ' (pending approval)';
                } else {
                    welcome.textContent = 'Hi, ' + name;
                }
                btn.textContent = 'Logout';
                btn.className = 'logout-btn';
                drawerLogin.textContent = 'Logout';
                drawerLogin.href = '#';
                drawerLogin.onclick = function (e) {
                    e.preventDefault();
                    toggleMenu();
                    handleAuthAction();
                };
            } catch (e) {
                welcome.textContent = 'Logged in';
                loggedIn = true;
                btn.textContent = 'Logout';
                btn.className = 'logout-btn';
            }
        });
    </script>
</body>
</html>
