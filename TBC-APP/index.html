<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBC Church App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="about.html">About Us</a>
        <a href="calendar.html" id="drawer-calendar">Calendar</a>
        <a href="chat.html" id="drawer-chats">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="soul-winning.html" id="drawer-soulwinning">Soul Winning</a>
        <a href="upload-photos.html" id="drawer-upload">Upload Photos</a>
        <a href="profile.html" id="drawer-profile">Profile</a>
        <a href="admin.html" id="drawer-admin" style="display:none;">Admin</a>
        <a href="#" id="drawer-logout" onclick="signOutUser().then(() => window.location.reload())">Logout</a>
    </div>

    <div class="home-logo-wrap">
        <img src="tbclogo.jpeg" alt="Temple Baptist Church Logo">
    </div>

    <div class="container menu-stack">
        <button class="menu-btn" onclick="window.location.href='about.html'">About Us</button>
        <button class="menu-btn" id="btn-calendar" onclick="goToProtected('calendar.html')">Calendar</button>
        <button class="menu-btn" id="btn-chats" onclick="goToProtected('chat.html')">Ministry Chats</button>
        <button class="menu-btn" onclick="window.location.href='bible/index.html'">Bible</button>
        <button class="menu-btn" onclick="window.location.href='give.html'">Give on Tithe.ly</button>
        <button class="menu-btn" onclick="window.location.href='sermons.html'">Sermons & Live Streams</button>
        <button class="menu-btn" id="btn-soulwinning" onclick="goToProtected('soul-winning.html')">Soul Winning</button>
        <button class="menu-btn" id="btn-upload" onclick="goToProtected('upload-photos.html')">Upload Photos</button>
    </div>

    <!-- Login / Create Account buttons at bottom when not logged in -->
    <div id="bottomAuth" class="container" style="margin-top: 30px; display: none;">
        <button class="menu-btn login-btn" onclick="window.location.href='login.html'">Login</button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #7a8fac 0%, #404040 100%); margin-top: 12px;" onclick="window.location.href='signup.html'">Create an Account</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        // Protected navigation for gated sections
        async function goToProtected(page) {
            const profile = await requireApprovedUser();
            if (profile) {
                window.location.href = page;
            }
        }

        auth.onAuthStateChanged(async function (user) {
            const bottom = document.getElementById('bottomAuth');
            const drawerProfile = document.getElementById('drawer-profile');
            const drawerLogout = document.getElementById('drawer-logout');
            const drawerCalendar = document.getElementById('drawer-calendar');
            const drawerChats = document.getElementById('drawer-chats');
            const drawerSoul = document.getElementById('drawer-soulwinning');
            const drawerUpload = document.getElementById('drawer-upload');
            const drawerAdmin = document.getElementById('drawer-admin');
            const btnCalendar = document.getElementById('btn-calendar');
            const btnChats = document.getElementById('btn-chats');
            const btnSoul = document.getElementById('btn-soulwinning');
            const btnUpload = document.getElementById('btn-upload');

            if (!user) {
                bottom.style.display = 'block';
                drawerProfile.style.display = 'none';
                drawerLogout.style.display = 'none';
                drawerCalendar.style.display = 'none';
                drawerChats.style.display = 'none';
                drawerSoul.style.display = 'none';
                drawerUpload.style.display = 'none';
                drawerAdmin.style.display = 'none';
                btnCalendar.style.display = 'none';
                btnChats.style.display = 'none';
                btnSoul.style.display = 'none';
                btnUpload.style.display = 'none';
                return;
            }

            bottom.style.display = 'none';
            drawerProfile.style.display = 'block';
            drawerLogout.style.display = 'block';
            drawerCalendar.style.display = 'block';
            drawerChats.style.display = 'block';
            drawerSoul.style.display = 'block';
            drawerUpload.style.display = 'block';
            btnCalendar.style.display = 'block';
            btnChats.style.display = 'block';
            btnSoul.style.display = 'block';
            btnUpload.style.display = 'block';

            try {
                const profile = await ensureUserProfile(user);
                if (profile && profile.role === 'admin') {
                    drawerAdmin.style.display = 'block';
                } else {
                    drawerAdmin.style.display = 'none';
                }
                if (profile && !profile.approved) {
                    drawerProfile.style.display = 'none';
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
