<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://browser.sentry-cdn.com/7.119.0/bundle.min.js" crossorigin="anonymous"></script>
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 20px 0; }
        .day-header { font-weight: bold; text-align: center; padding: 8px; background: #7bafdd; color: white; border-radius: 6px; }
        .day-cell { min-height: 70px; border: 1px solid #ddd; padding: 6px; border-radius: 8px; background: white; cursor: pointer; position: relative; }
        .day-cell.other-month { background: #f8f8f8; color: #aaa; }
        .day-number { font-weight: bold; margin-bottom: 4px; }
        .event { font-size: 0.75rem; color: white; padding: 2px 6px; border-radius: 4px; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-more { font-size: 0.7rem; color: #666; margin-top: 2px; font-weight: bold; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .filter-btn { padding: 8px 16px; border: 2px solid #ccc; background: white; color: #666; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .filter-btn.active { color: white; }
        .day-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            box-sizing: border-box;
        }
        .day-modal.open { display: flex; }
        .day-modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .day-modal h3 { margin-top: 0; color: #404040; }
        .day-event {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .day-event .ministry-tag {
            display: inline-block;
            font-size: 0.75rem;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }
        .cal-nav {
            margin: 16px 0 12px;
            text-align: center;
        }
        .cal-nav-btns {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .cal-nav-btn {
            width: 110px;
            padding: 10px 0;
            border-radius: 10px;
            border: 2px solid #4cb8b9;
            background: white;
            color: #4cb8b9;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-sizing: border-box;
        }
        .cal-nav-btn:active {
            transform: scale(0.96);
        }
        .cal-nav-label {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 10px;
            color: #404040;
        }
        .cal-nav-label #cal-month {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .cal-nav-label #cal-year {
            font-size: 1.25rem;
            font-weight: 600;
            color: #7a8fac;
        }
    </style>
</head>
<body>
    <header>
        <h1>Church Calendar</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="filter-bar" id="filter-bar"></div>

        <div class="cal-nav">
            <div class="cal-nav-btns">
                <button type="button" class="cal-nav-btn" onclick="prevMonth()">< Prev</button>
                <button type="button" class="cal-nav-btn" onclick="nextMonth()">Next ></button>
            </div>
            <div class="cal-nav-label">
                <span id="cal-month"></span>
                <span id="cal-year"></span>
            </div>
        </div>

        <div class="calendar-grid" id="calendar-grid"></div>

        <div id="add-event-section" style="display:none;">
            <h3 style="margin-top:30px; color:#404040;">Add New Event</h3>
            <p id="add-event-hint" style="font-size:0.85rem;color:#7a8fac;margin:0 0 8px;"></p>
            <div style="background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                <input type="date" id="event-date" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <input type="text" id="event-title" placeholder="Event Title" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <textarea id="event-desc" placeholder="Description (optional)" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; height:80px;"></textarea>
                <select id="event-ministry" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;"></select>
                <button onclick="addEvent()" class="menu-btn" style="margin-top:10px;">Add Event</button>
            </div>
        </div>
    </div>

    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="upload-photos.html">Upload Photos</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <div class="day-modal" id="day-modal" onclick="if(event.target===this)closeDayModal()">
        <div class="day-modal-content">
            <h3 id="day-modal-title">Events</h3>
            <div id="day-modal-events"></div>
            <button onclick="closeDayModal()" style="width:100%; margin-top:10px; background:#7a8fac; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold;">Close</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="home-logo.js"></script>
    <script>
        let currentDate = new Date();
        let allEvents = [];
        let selectedFilters = new Set(['Whole Church']);
        let currentProfile = null;

        const ministryColors = {
            'Whole Church': '#7bafdd',
            'Music Ministry': '#8845a5',
            'Sentry': '#e67e22',
            'Nursery': '#27ae60',
            'Media': '#4cb8b9'
        };
        const allMinistries = ['Whole Church', 'Music Ministry', 'Sentry', 'Nursery', 'Media'];

        function getMinistryColor(ministry) {
            return ministryColors[ministry] || '#4cb8b9';
        }

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('open');
        }

        function renderFilterBar(userMinistries, isAdmin) {
            const container = document.getElementById('filter-bar');
            container.innerHTML = '';
            allMinistries.forEach(ministry => {
                if (ministry !== 'Whole Church' && !(isAdmin || userMinistries.includes(ministry))) return;
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (selectedFilters.has(ministry) ? ' active' : '');
                btn.textContent = ministry;
                btn.style.borderColor = getMinistryColor(ministry);
                if (selectedFilters.has(ministry)) {
                    btn.style.background = getMinistryColor(ministry);
                    btn.style.color = 'white';
                }
                btn.onclick = () => {
                    if (selectedFilters.has(ministry)) selectedFilters.delete(ministry);
                    else selectedFilters.add(ministry);
                    if (selectedFilters.size === 0) selectedFilters.add('Whole Church');
                    renderFilterBar(userMinistries, isAdmin);
                    renderCalendar();
                };
                container.appendChild(btn);
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('cal-month').textContent = currentDate.toLocaleString('default', { month: 'long' });
            document.getElementById('cal-year').textContent = String(currentDate.getFullYear());

            grid.innerHTML = '';
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.textContent = d;
                grid.appendChild(h);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevDays = new Date(year, month, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.innerHTML = '<div class="day-number">' + (prevDays - firstDay + 1 + i) + '</div>';
                grid.appendChild(cell);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                cell.innerHTML = '<div class="day-number">' + day + '</div>';

                const dayEvents = allEvents.filter(ev => {
                    if (ev.date !== dateStr) return false;
                    return selectedFilters.has(ev.ministry);
                });

                const maxShow = 2;
                dayEvents.slice(0, maxShow).forEach(ev => {
                    const evEl = document.createElement('div');
                    evEl.className = 'event';
                    evEl.textContent = ev.title;
                    evEl.style.background = getMinistryColor(ev.ministry);
                    cell.appendChild(evEl);
                });
                if (dayEvents.length > maxShow) {
                    const more = document.createElement('div');
                    more.className = 'event-more';
                    more.textContent = '+' + (dayEvents.length - maxShow) + ' more';
                    cell.appendChild(more);
                }

                cell.onclick = () => showDayEvents(dateStr, dayEvents);
                grid.appendChild(cell);
            }
        }

        function showDayEvents(dateStr, events) {
            const modal = document.getElementById('day-modal');
            const titleEl = document.getElementById('day-modal-title');
            const eventsEl = document.getElementById('day-modal-events');
            const parts = dateStr.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            titleEl.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
            eventsEl.innerHTML = '';
            if (!events || events.length === 0) {
                eventsEl.innerHTML = '<p style="color:#666;">No events on this day.</p>';
            } else {
                events.forEach(ev => {
                    const div = document.createElement('div');
                    div.className = 'day-event';
                    const color = getMinistryColor(ev.ministry);
                    div.innerHTML = '<strong>' + (ev.title || '') + '</strong>' +
                        (ev.description ? '<div style="margin-top:6px;color:#555;">' + ev.description + '</div>' : '') +
                        '<div class="ministry-tag" style="background:' + color + ';">' + (ev.ministry || '') + '</div>';
                    eventsEl.appendChild(div);
                });
            }
            modal.classList.add('open');
        }

        async function loadEvents() {
            try {
                const snapshot = await db.collection('events').get();
                allEvents = [];
                snapshot.forEach(doc => allEvents.push({ id: doc.id, ...doc.data() }));
                renderCalendar();
            } catch (err) {
                console.error('Error loading events:', err);
                renderCalendar();
            }
        }

        function setupAddEventForm(profile) {
            const section = document.getElementById('add-event-section');
            const select = document.getElementById('event-ministry');
            const hint = document.getElementById('add-event-hint');
            const isAdmin = profile.role === 'admin';
            const isLeader = profile.role === 'leader';
            const leaderOf = Array.isArray(profile.leaderOf) ? profile.leaderOf.slice() : [];

            let allowed = [];
            if (isAdmin) {
                allowed = allMinistries.slice();
                hint.textContent = 'As an admin you can create events for any ministry.';
            } else if (isLeader && leaderOf.length) {
                allowed = leaderOf.filter(m => allMinistries.includes(m));
                if (!allowed.length) allowed = leaderOf.slice();
                hint.textContent = 'You can create events for: ' + allowed.join(', ');
            } else {
                section.style.display = 'none';
                return;
            }

            if (!allowed.length) {
                section.style.display = 'none';
                return;
            }

            select.innerHTML = allowed.map(m =>
                '<option value="' + m.replace(/"/g, '"') + '">' + m + '</option>'
            ).join('');
            section.style.display = 'block';
        }

        async function addEvent() {
            if (!currentProfile) return;
            const date = document.getElementById('event-date').value;
            const title = document.getElementById('event-title').value.trim();
            const desc = document.getElementById('event-desc').value.trim();
            const ministry = document.getElementById('event-ministry').value;

            if (!date || !title) {
                alert('Please enter a date and title');
                return;
            }

            const isAdmin = currentProfile.role === 'admin';
            const leaderOf = currentProfile.leaderOf || [];
            if (!isAdmin && !leaderOf.includes(ministry)) {
                alert('You can only create events for ministries you lead.');
                return;
            }

            try {
                await db.collection('events').add({
                    date: date,
                    title: title,
                    description: desc,
                    ministry: ministry,
                    createdByUid: auth.currentUser.uid,
                    createdByName: currentProfile.name || currentProfile.email || 'Leader',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Event added!');
                document.getElementById('event-date').value = '';
                document.getElementById('event-title').value = '';
                document.getElementById('event-desc').value = '';
                await loadEvents();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

        requireApprovedUser().then(profile => {
            if (profile) {
                currentProfile = profile;
                const userMinistries = profile.ministries || [];
                const isAdmin = profile.role === 'admin';
                renderFilterBar(userMinistries, isAdmin);
                setupAddEventForm(profile);
                loadEvents();
            }
        });
    </script>
</body>
</html>
