<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Sentry Error Tracking -->
    <script src="https://browser.sentry-cdn.com/7.119.0/bundle.min.js" integrity="sha384-..." crossorigin="anonymous"></script>
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 20px 0; }
        .day-header { font-weight: bold; text-align: center; padding: 8px; background: #7bafdd; color: white; border-radius: 6px; }
        .day-cell { min-height: 70px; border: 1px solid #ddd; padding: 6px; border-radius: 8px; background: white; cursor: pointer; position: relative; }
        .day-cell.other-month { background: #f8f8f8; color: #aaa; }
        .day-number { font-weight: bold; margin-bottom: 4px; }
        .event { font-size: 0.75rem; color: white; padding: 2px 6px; border-radius: 4px; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-more { font-size: 0.7rem; color: #666; margin-top: 2px; font-weight: bold; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0; }
        .filter-btn { padding: 8px 16px; border: 2px solid #ccc; background: white; color: #666; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .filter-btn.active { color: white; }

        .day-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            box-sizing: border-box;
        }
        .day-modal.open { display: flex; }
        .day-modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .day-modal h3 { margin-top: 0; color: #404040; }
        .day-event {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .day-event .ministry-tag {
            display: inline-block;
            font-size: 0.75rem;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Church Calendar</h1>
        <button class="hamburger" onclick="toggleDrawer()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </header>

    <div class="container">
        <div class="filter-bar" id="filter-bar">
            <!-- Populated dynamically based on user ministries -->
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin:15px 0;">
            <button onclick="prevMonth()" style="padding:8px 16px; border-radius:8px; border:2px solid #4cb8b9; background:white; color:#4cb8b9; font-weight:bold;">< Prev</button>
            <h2 id="month-year" style="margin:0; color:#404040;"></h2>
            <button onclick="nextMonth()" style="padding:8px 16px; border-radius:8px; border:2px solid #4cb8b9; background:white; color:#4cb8b9; font-weight:bold;">Next ></button>
        </div>

        <div class="calendar-grid" id="calendar-grid"></div>

        <h3 style="margin-top:30px; color:#404040;">Add New Event</h3>
        <div style="background:white; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
            <input type="date" id="event-date" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="text" id="event-title" placeholder="Event Title" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <textarea id="event-desc" placeholder="Description (optional)" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; height:80px;"></textarea>
            <select id="event-ministry" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
                <option value="Whole Church">Whole Church</option>
                <option value="Music Ministry">Music Ministry</option>
                <option value="Sentry">Sentry</option>
                <option value="Nursery">Nursery</option>
                <option value="Media">Media</option>
            </select>
            <button onclick="addEvent()" class="menu-btn" style="margin-top:10px;">Add Event</button>
        </div>
    </div>

    <!-- Hamburger Drawer -->
    <div class="nav-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="nav-drawer" id="drawer">
        <h3 style="margin-top:0; color:#404040;">Menu</h3>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="sermons.html">Sermons</a>
        <a href="give.html">Give</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="logoutUser(); return false;" style="color:#8845a5; font-weight:bold; margin-top:20px;">Logout</a>
    </div>

    <!-- Day events modal - shows ALL events, scrollable, no limit -->
    <div class="day-modal" id="day-modal" onclick="if (event.target.id === 'day-modal') closeDayModal()">
        <div class="day-modal-content">
            <h3 id="day-modal-title"></h3>
            <div id="day-modal-events"></div>
            <button onclick="closeDayModal()" style="width:100%; margin-top:10px; background:#7a8fac; color:white; border:none; padding:12px; border-radius:12px; font-weight:bold;">Close</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="home-logo.js"></script>
    <script>
        // Initialize Sentry (replace DSN with your project key)
        if (typeof Sentry !== 'undefined') {
            Sentry.init({
                dsn: 'YOUR_SENTRY_DSN_HERE', // <-- paste your Sentry DSN here
                tracesSampleRate: 1.0,
            });
        }

        let currentDate = new Date();
        let allEvents = [];
        // Multi-select: start with Whole Church on. Click any button to toggle it on/off.
        let selectedFilters = new Set(['Whole Church']);

        // Unique color per ministry
        const ministryColors = {
            'Whole Church': '#7bafdd',
            'Music Ministry': '#8845a5',
            'Sentry': '#e67e22',
            'Nursery': '#27ae60',
            'Media': '#4cb8b9'
        };

        function getMinistryColor(ministry) {
            return ministryColors[ministry] || '#4cb8b9';
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.remove('open');
        }

        // Keep in sync with chat.html ministries
        const allMinistries = ['Whole Church', 'Music Ministry', 'Sentry', 'Nursery', 'Media'];

        function renderFilterBar(userMinistries, isAdmin) {
            const container = document.getElementById('filter-bar');
            container.innerHTML = '';

            allMinistries.forEach(ministry => {
                // Whole Church always visible; others only if admin or assigned
                if (ministry !== 'Whole Church' && !(isAdmin || userMinistries.includes(ministry))) {
                    return;
                }

                const color = getMinistryColor(ministry);
                const isActive = selectedFilters.has(ministry);

                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (selectedFilters.has(ministry) ? ' active' : '');
                btn.dataset.filter = ministry;
                btn.textContent = ministry;
                btn.style.borderColor = color;
                if (isActive) {
                    btn.style.background = color;
                    btn.style.color = 'white';
                } else {
                    btn.style.background = 'white';
                    btn.style.color = color;
                }

                btn.onclick = () => {
                    if (selectedFilters.has(ministry)) {
                        selectedFilters.delete(ministry);
                        btn.classList.remove('active');
                        btn.style.background = 'white';
                        btn.style.color = color;
                    } else {
                        selectedFilters.add(ministry);
                        btn.classList.add('active');
                        btn.style.background = color;
                        btn.style.color = 'white';
                    }
                    renderCalendar();
                };
                container.appendChild(btn);
            });
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('month-year').textContent = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const headers = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            headers.forEach(h => {
                const el = document.createElement('div');
                el.className = 'day-header';
                el.textContent = h;
                grid.appendChild(el);
            });

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell other-month';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

                const num = document.createElement('div');
                num.className = 'day-number';
                num.textContent = day;
                cell.appendChild(num);

                // Show event if its ministry is currently selected
                const dayEvents = allEvents.filter(e =>
                    e.date === dateStr && selectedFilters.has(e.ministry)
                );

                // Show only first 4 on the grid, then +N more
                const maxShow = 4;
                dayEvents.slice(0, maxShow).forEach(ev => {
                    const evEl = document.createElement('div');
                    evEl.className = 'event';
                    evEl.textContent = ev.title;
                    evEl.style.background = getMinistryColor(ev.ministry);
                    cell.appendChild(evEl);
                });
                if (dayEvents.length > maxShow) {
                    const more = document.createElement('div');
                    more.className = 'event-more';
                    more.textContent = '+' + (dayEvents.length - maxShow) + ' more';
                    cell.appendChild(more);
                }

                cell.onclick = () => showDayEvents(dateStr, dayEvents);
                grid.appendChild(cell);
            }
        }

        function showDayEvents(dateStr, events) {
            const modal = document.getElementById('day-modal');
            const titleEl = document.getElementById('day-modal-title');
            const eventsEl = document.getElementById('day-modal-events');

            // Format title from date string
            const parts = dateStr.split('-');
            const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            titleEl.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

            eventsEl.innerHTML = '';
            if (!events || events.length === 0) {
                eventsEl.innerHTML = '<p style="color:#666;">No events on this day.</p>';
            } else {
                // Show ALL events — no limit
                events.forEach(ev => {
                    const div = document.createElement('div');
                    div.className = 'day-event';
                    const color = getMinistryColor(ev.ministry);
                    div.innerHTML =
                        `<strong>${ev.title || 'Event'}</strong>` +
                        (ev.description ? `<br>${ev.description}` : '') +
                        `<div class="ministry-tag" style="background:${color};">${ev.ministry || ''}</div>`;
                    eventsEl.appendChild(div);
                });
            }
            modal.classList.add('open');
        }

        async function loadEvents() {
            try {
                const snapshot = await db.collection('events').get();
                allEvents = [];
                snapshot.forEach(doc => allEvents.push({ id: doc.id, ...doc.data() }));
                renderCalendar();
            } catch (err) {
                console.error('Error loading events:', err);
                if (typeof Sentry !== 'undefined') Sentry.captureException(err);
                renderCalendar();
            }
        }

        async function addEvent() {
            const date = document.getElementById('event-date').value;
            const title = document.getElementById('event-title').value.trim();
            const desc = document.getElementById('event-desc').value.trim();
            const ministry = document.getElementById('event-ministry').value;

            if (!date || !title) {
                alert('Please enter a date and title');
                return;
            }

            try {
                await db.collection('events').add({
                    date, title, description: desc, ministry,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Event added!');
                document.getElementById('event-date').value = '';
                document.getElementById('event-title').value = '';
                document.getElementById('event-desc').value = '';
                await loadEvents();
            } catch (err) {
                alert('Error: ' + err.message);
                if (typeof Sentry !== 'undefined') Sentry.captureException(err);
            }
        }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

        // Init - profile is returned directly (has .role and .ministries)
        requireApprovedUser().then(profile => {
            if (profile) {
                const userMinistries = profile.ministries || [];
                const isAdmin = profile.role === 'admin';
                renderFilterBar(userMinistries, isAdmin);
                loadEvents();
            }
        });
    </script>
</body>
</html>
