<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - TBC</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .cal-nav { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
      .cal-nav button { width:auto; flex:0 0 auto; padding:12px 14px; margin:0; }
      .cal-nav h2 { margin:0; flex:1; text-align:center; font-size:1.15rem; }
      #ministry-filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
      #ministry-filters button { width:auto; margin:0; padding:10px 14px; font-size:0.9rem; }
      #ministry-filters button.active { background: linear-gradient(135deg, #8845a5 0%, #ac8ce6 100%); }
      #ministry-filters button.inactive { background: #e8eef2; color:#404040; box-shadow:none; }
      #calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
      .cal-head { text-align:center; font-weight:700; background:#7bafdd; color:#fff; padding:8px 4px; border-radius:8px; font-size:0.8rem; }
      .cal-day { border:1px solid rgba(122,143,172,0.4); background:#fff; padding:8px; min-height:64px; border-radius:10px; font-size:0.9rem; }
      .cal-day.has-event { border-color:#4cb8b9; background:#f0fbfb; }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="#" onclick="window.open('https://www.google.com/maps/place/11801+E+Lincoln+St,+Wichita,+KS+67207', '_blank'); toggleMenu(); return false;">View Location on Google Maps</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <header><h1>TBC Calendar</h1></header>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>
        <button class="menu-btn" onclick="showAddEventForm()">+ Add New Event</button>

        <div class="cal-nav">
          <button onclick="prevMonth()">← Prev</button>
          <h2 id="month-title">July 2026</h2>
          <button onclick="nextMonth()">Next →</button>
        </div>

        <div id="ministry-filters"></div>
        <div id="calendar-grid"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script>
      function toggleMenu() {
        document.getElementById('navDrawer').classList.toggle('open');
        document.getElementById('navOverlay').classList.toggle('open');
      }

      requireApprovedUser();

      let events = JSON.parse(localStorage.getItem('events') || '[]');
      let currentMonth = 7;
      let currentYear = 2026;
      let selectedMinistries = [];
      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const ministries = ["Nursery", "Music - Singing", "Music - Piano", "Sentry", "Media"];

      function prevMonth() { currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; } renderCalendar(); }
      function nextMonth() { currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; } renderCalendar(); }

      function renderFilters() {
        const container = document.getElementById('ministry-filters');
        let html = '';
        ministries.forEach(m => {
          const isActive = selectedMinistries.includes(m);
          html += `<button class="${isActive ? 'active' : 'inactive'}" onclick="toggleFilter('${m}')">${m}</button>`;
        });
        container.innerHTML = html;
      }

      function toggleFilter(min) {
        if (selectedMinistries.includes(min)) {
          selectedMinistries = selectedMinistries.filter(m => m !== min);
        } else {
          selectedMinistries.push(min);
        }
        renderFilters();
        renderCalendar();
      }

      function showAddEventForm() {
        let dayOptions = '';
        for (let i = 1; i <= 31; i++) dayOptions += `<option value="${i}">Day ${i}</option>`;
        document.body.innerHTML = `
          <header><h1>Add Event</h1></header>
          <div class="container">
            <h2>Add New Event</h2>
            <input type="text" id="event-title" placeholder="Event Title" onkeypress="if(event.key==='Enter') saveEvent()">
            <select id="event-day">${dayOptions}</select>
            <input type="text" id="event-time" placeholder="Time (e.g. 9:00 AM)" value="9:00 AM">
            <select id="event-ministry">
              <option value="Church Wide">Church Wide</option>
              ${ministries.map(m => `<option value="${m}">${m}</option>`).join('')}
            </select>
            <button class="menu-btn" onclick="saveEvent()">Save Event</button>
            <button class="back-btn" onclick="window.location.reload()">Cancel</button>
          </div>`;
      }

      function saveEvent() {
        const title = document.getElementById('event-title').value || "New Event";
        const day = parseInt(document.getElementById('event-day').value);
        const time = document.getElementById('event-time').value;
        const ministry = document.getElementById('event-ministry').value;
        let events = JSON.parse(localStorage.getItem('events') || '[]');
        events.push({title, day, time, ministry, month: currentMonth, year: currentYear});
        localStorage.setItem('events', JSON.stringify(events));
        alert("Event Saved!");
        window.location.reload();
      }

      function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        let html = '';
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        days.forEach(d => html += `<div class="cal-head">${d}</div>`;
        for (let i = 1; i <= 31; i++) {
          let dayEvents = events.filter(e => e.day === i && e.month === currentMonth && e.year === currentYear);
          dayEvents = dayEvents.filter(e => e.ministry === "Church Wide" || selectedMinistries.includes(e.ministry));
          const has = dayEvents.length > 0;
          html += `<div class="cal-day${has ? ' has-event' : ''}" onclick="alert('Day ${i}')"><strong>${i}</strong>${has ? ' •' : ''}</div>`;
        }
        grid.innerHTML = html;
        document.getElementById('month-title').textContent = `${monthNames[currentMonth-1]} ${currentYear}`;
      }

      renderFilters();
      renderCalendar();
    </script>
</body>
</html>
