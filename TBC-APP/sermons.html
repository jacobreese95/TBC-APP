<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sermons & Live - TBC</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stream-hero {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
        }
        .stream-hero-player {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }
        .stream-hero-player iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .stream-hero-meta {
            padding: 14px 16px 16px;
        }
        .live-badge {
            display: inline-block;
            background: #c62828;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 8px;
        }
        .stream-title {
            margin: 0 0 4px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }
        .stream-sub {
            margin: 0;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .section-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
            margin: 8px 0 10px;
        }
        .stream-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stream-card {
            display: flex;
            gap: 12px;
            align-items: stretch;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .stream-card:active { transform: scale(0.99); }
        .stream-card img {
            width: 128px;
            min-height: 72px;
            object-fit: cover;
            flex-shrink: 0;
            background: #222;
        }
        .stream-card-body {
            padding: 10px 12px 10px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }
        .stream-card-title {
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.3;
            margin: 0 0 4px;
            color: var(--text);
        }
        .stream-card-date {
            font-size: 0.75rem;
            color: var(--muted);
            margin: 0;
        }
        .stream-status {
            text-align: center;
            padding: 28px 16px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .stream-error {
            background: rgba(198, 40, 40, 0.08);
            border: 1px solid rgba(198, 40, 40, 0.25);
            color: var(--text);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.9rem;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .yt-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--teal);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .api-setup {
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 0.88rem;
            color: var(--muted);
            line-height: 1.45;
        }
        .api-setup strong { color: var(--text); }
        .api-setup code {
            background: var(--input-bg);
            padding: 1px 6px;
            border-radius: 6px;
            font-size: 0.82rem;
        }
        .api-setup input {
            margin-top: 10px;
            margin-bottom: 8px;
        }
        .api-setup button {
            margin: 0;
            width: auto;
            display: inline-block;
            padding: 10px 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <header><h1>Sermons & Live</h1></header>
    <div class="container">
        <div id="apiSetup" class="api-setup" style="display:none">
            <strong>One-time setup:</strong> Paste your YouTube Data API key below so the app can load live streams automatically.
            <input type="text" id="apiKeyInput" class="form-input" placeholder="YouTube API key" autocomplete="off">
            <button type="button" id="saveApiKeyBtn">Save key</button>
        </div>

        <div id="streamError" class="stream-error" style="display:none"></div>
        <div id="featured" class="stream-status">Loading streams…</div>
        <div class="section-label" id="recentLabel" style="display:none">Recent services</div>
        <div id="recentList" class="stream-list"></div>
        <a class="yt-link" href="https://www.youtube.com/@TBCWichita1/streams" target="_blank" rel="noopener">Open on YouTube →</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="auth.js"></script>
    <script src="home-logo.js"></script>
    <script>
      // TBC Wichita YouTube channel
      var CHANNEL_ID = 'UCQqlzMIDobV23YjacOZysSg';
      var CHANNEL_HANDLE = '@TBCWichita1';
      var API_KEY_STORAGE = 'tbc-youtube-api-key';
      var HARDCODED_API_KEY = 'AIzaSyBCbF-l-iS52aiS7Rsr6zL_bTHxzLo2Mj0';

      function toggleMenu() {
        document.getElementById('navDrawer').classList.toggle('open');
        document.getElementById('navOverlay').classList.toggle('open');
      }

      function getApiKey() {
        if (HARDCODED_API_KEY) return HARDCODED_API_KEY;
        try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch (e) { return ''; }
      }

      function setApiKey(key) {
        try { localStorage.setItem(API_KEY_STORAGE, key); } catch (e) {}
      }

      function showError(msg) {
        var el = document.getElementById('streamError');
        el.style.display = 'block';
        el.textContent = msg;
      }

      function hideError() {
        document.getElementById('streamError').style.display = 'none';
      }

      function formatDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      }

      function embedUrl(videoId) {
        return 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?rel=0&modestbranding=1';
      }

      function thumbUrl(item) {
        var s = (item.snippet && item.snippet.thumbnails) || {};
        var t = s.medium || s.high || s.default || {};
        return t.url || '';
      }

      function renderFeatured(item, isLive) {
        var id = item.id && item.id.videoId ? item.id.videoId : (typeof item.id === 'string' ? item.id : '');
        if (!id && item.snippet && item.snippet.resourceId) id = item.snippet.resourceId.videoId;
        var title = (item.snippet && item.snippet.title) || 'Service';
        var published = (item.snippet && (item.snippet.publishedAt || item.snippet.publishTime)) || '';
        var html =
          '<div class="stream-hero">' +
          '<div class="stream-hero-player">' +
          '<iframe src="' + embedUrl(id) + '" title="' + title.replace(/"/g, '') + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>' +
          '</div>' +
          '<div class="stream-hero-meta">' +
          (isLive ? '<span class="live-badge">LIVE NOW</span>' : '') +
          '<h2 class="stream-title">' + escapeHtml(title) + '</h2>' +
          '<p class="stream-sub">' + (isLive ? 'Streaming now on YouTube' : formatDate(published)) + '</p>' +
          '</div></div>';
        document.getElementById('featured').outerHTML = '<div id="featured">' + html + '</div>';
      }

      function renderRecent(items, featuredId) {
        var list = document.getElementById('recentList');
        var label = document.getElementById('recentLabel');
        var cards = [];
        items.forEach(function (item) {
          var id = item.id && item.id.videoId ? item.id.videoId : (typeof item.id === 'string' ? item.id : '');
          if (!id && item.snippet && item.snippet.resourceId) id = item.snippet.resourceId.videoId;
          if (!id || id === featuredId) return;
          if (cards.length >= 10) return;
          var title = (item.snippet && item.snippet.title) || 'Service';
          var published = (item.snippet && (item.snippet.publishedAt || item.snippet.publishTime)) || '';
          var thumb = thumbUrl(item);
          cards.push(
            '<a class="stream-card" href="#" data-vid="' + escapeHtml(id) + '">' +
            (thumb ? '<img src="' + escapeHtml(thumb) + '" alt="">' : '<div style="width:128px;background:#333"></div>') +
            '<div class="stream-card-body">' +
            '<p class="stream-card-title">' + escapeHtml(title) + '</p>' +
            '<p class="stream-card-date">' + escapeHtml(formatDate(published)) + '</p>' +
            '</div></a>'
          );
        });
        if (!cards.length) {
          label.style.display = 'none';
          list.innerHTML = '';
          return;
        }
        label.style.display = 'block';
        list.innerHTML = cards.join('');
        list.querySelectorAll('.stream-card').forEach(function (el) {
          el.addEventListener('click', function (e) {
            e.preventDefault();
            var vid = el.getAttribute('data-vid');
            if (!vid) return;
            var fake = {
              id: { videoId: vid },
              snippet: {
                title: el.querySelector('.stream-card-title').textContent,
                publishedAt: el.querySelector('.stream-card-date').textContent
              }
            };
            renderFeatured(fake, false);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        });
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&')
          .replace(/</g, '<')
          .replace(/>/g, '>')
          .replace(/"/g, '"');
      }

      async function ytGet(path, params) {
        var key = getApiKey();
        var q = new URLSearchParams(Object.assign({ key: key }, params));
        var url = 'https://www.googleapis.com/youtube/v3/' + path + '?' + q.toString();
        var res = await fetch(url);
        var data = await res.json();
        if (!res.ok) {
          var msg = (data.error && data.error.message) || ('YouTube API error ' + res.status);
          throw new Error(msg);
        }
        return data;
      }

      async function loadStreams() {
        hideError();
        var key = getApiKey();
        if (!key) {
          document.getElementById('apiSetup').style.display = 'block';
          document.getElementById('featured').innerHTML = '<div class="stream-status">Add a YouTube API key above to load services.</div>';
          return;
        }
        document.getElementById('apiSetup').style.display = 'none';
        document.getElementById('featured').innerHTML = '<div class="stream-status">Loading streams…</div>';

        try {
          var live = await ytGet('search', {
            part: 'snippet',
            channelId: CHANNEL_ID,
            eventType: 'live',
            type: 'video',
            maxResults: '1'
          });

          var featured = null;
          var isLive = false;
          if (live.items && live.items.length) {
            featured = live.items[0];
            isLive = true;
          }

          var completed = await ytGet('search', {
            part: 'snippet',
            channelId: CHANNEL_ID,
            eventType: 'completed',
            type: 'video',
            order: 'date',
            maxResults: '12'
          });

          var recent = (completed.items || []);

          if (!recent.length) {
            var latest = await ytGet('search', {
              part: 'snippet',
              channelId: CHANNEL_ID,
              type: 'video',
              order: 'date',
              maxResults: '12'
            });
            recent = latest.items || [];
          }

          // Newest first (top of list → older as you scroll down)
          recent.sort(function (a, b) {
            var da = new Date((a.snippet && (a.snippet.publishedAt || a.snippet.publishTime)) || 0).getTime();
            var db = new Date((b.snippet && (b.snippet.publishedAt || b.snippet.publishTime)) || 0).getTime();
            return db - da;
          });

          if (!featured && recent.length) {
            featured = recent[0];
          }

          if (!featured) {
            document.getElementById('featured').innerHTML = '<div class="stream-status">No streams found yet. Check back on Sunday.</div>';
            return;
          }

          renderFeatured(featured, isLive);
          var featuredId = featured.id && featured.id.videoId ? featured.id.videoId : '';
          renderRecent(recent, featuredId);
        } catch (e) {
          console.error(e);
          var msg = e.message || 'Could not load YouTube streams.';
          if (/API key|keyInvalid|keyExpired|permission|forbidden|403|400/i.test(msg)) {
            document.getElementById('apiSetup').style.display = 'block';
            msg = 'YouTube API key missing or invalid. Paste a valid key above. (' + msg + ')';
          }
          showError(msg);
          document.getElementById('featured').innerHTML = '<div class="stream-status">Unable to load streams right now.</div>';
        }
      }

      document.getElementById('saveApiKeyBtn').addEventListener('click', function () {
        var key = (document.getElementById('apiKeyInput').value || '').trim();
        if (!key) return;
        setApiKey(key);
        loadStreams();
      });

      (function () {
        var existing = getApiKey();
        if (existing) document.getElementById('apiKeyInput').value = existing;
      })();

      loadStreams();
    </script>
</body>
</html>
