<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - TBC Church App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .user-name { font-weight: bold; font-size: 1.1rem; }
        .user-email { color: #666; font-size: 0.9rem; }
        .profile-fields {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .profile-fields div { margin: 4px 0; }
        .role-select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .section-label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #404040;
            margin: 12px 0 6px;
        }
        .hint {
            font-size: 0.8rem;
            color: #7a8fac;
            margin: 0 0 8px;
        }
        .ministry-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 12px;
        }
        .ministry-checkboxes label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8f9fa;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .leader-box {
            background: #eef8f8;
            border: 1px solid #4cb8b9;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0 14px;
        }
        .leader-box .ministry-checkboxes label {
            background: #fff;
        }
        .save-btn {
            background: linear-gradient(135deg, #4cb8b9, #7bafdd);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .pending { background: #fff3cd; }
        .approved { background: #d4edda; }
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: #404040;
            color: #fff;
            margin-left: 6px;
        }
        .badge.leader { background: #4cb8b9; }
        .badge.admin { background: #8845a5; }

        .admin-avatar-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 8px 0 12px;
        }
        .admin-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            background: #e0e0e0;
            border: 2px solid #4cb8b9;
        }
        .admin-avatar-placeholder {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #eef8f8;
            border: 2px dashed #7a8fac;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a8fac;
            font-size: 0.75rem;
            text-align: center;
        }
        .admin-edit-area {
            width: 100%;
            min-height: 72px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .photo-status { font-size: 0.8rem; color: #7a8fac; margin-top: 4px; }
    </style>
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
    </header>

    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

        <h2>Manage Users</h2>
        <p class="hint">Set role to <strong>Leader</strong>, then check which ministries they lead. Leaders can create calendar events only for those ministries. Edit profile info, photo, songs, and music groups below.</p>
        <div id="users-list">Loading users...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    <script src="auth.js"></script>
    <script src="admin-app.js"></script>
</body>
</html>
