<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TBC Church App</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-form { max-width: 400px; margin: 20px auto; padding: 20px; }
        .profile-form input, .profile-form textarea {
            width: 100%;
            height: 48px;
            padding: 12px 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .profile-form textarea { height: auto; min-height: 96px; }
        .profile-pic-wrap {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 12px;
            position: relative;
            overflow: hidden;
            background: var(--cream, #dedcd0);
            border: 3px solid #4cb8b9;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }
        .profile-pic-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .profile-pic-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #7a8fac;
        }
        .pic-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .pic-actions button {
            width: auto;
            margin: 0;
            padding: 10px 14px;
            font-size: 0.9rem;
        }
        .pic-progress {
            display: none;
            text-align: center;
            font-size: 0.85rem;
            color: #7a8fac;
            margin: -8px 0 14px;
        }
        .pic-progress .bar-bg {
            height: 8px;
            background: #e8eef2;
            border-radius: 6px;
            overflow: hidden;
            margin: 6px 0;
        }
        .pic-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #4cb8b9, #7bafdd);
            transition: width 0.15s;
        }
        .info-box {
            background: var(--input-bg, #f7fafb);
            border: 1px solid var(--border, #ddd);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0 15px;
            min-height: 40px;
            color: var(--text, #404040);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Open menu">
        <span></span><span></span><span></span>
    </button>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="nav-drawer" id="navDrawer">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="calendar.html">Calendar</a>
        <a href="directory.html">Church Directory</a>
        <a href="music-groups.html">Music Groups</a>
        <a href="chat.html">Ministry Chats</a>
        <a href="bible/index.html">Bible</a>
        <a href="give.html">Give on Tithe.ly</a>
        <a href="sermons.html">Sermons & Live Streams</a>
        <a href="soul-winning.html">Soul Winning</a>
        <a href="profile.html">Profile</a>
        <a href="#" onclick="signOutUser().then(() => window.location.href='index.html')">Logout</a>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin-top:60px;">My Profile</h2>
        <div class="profile-form">
            <div class="profile-pic-wrap" id="picWrap">
                <div class="profile-pic-placeholder" id="picPlaceholder">👤</div>
                <img id="picImg" alt="Profile" style="display:none">
            </div>
            <div class="pic-actions">
                <button type="button" class="menu-btn" style="background:#7a8fac" onclick="document.getElementById('picLibrary').click()">📱 From Photos</button>
                <button type="button" class="menu-btn" style="background:#4cb8b9" onclick="document.getElementById('picCamera').click()">📸 Take Photo</button>
            </div>
            <input type="file" id="picLibrary" accept="image/*" style="display:none">
            <input type="file" id="picCamera" accept="image/*" capture="user" style="display:none">
            <div class="pic-progress" id="picProgress">
                <div class="bar-bg"><div class="bar" id="picBar"></div></div>
                <span id="picProgressText">Uploading…</span>
            </div>
            <p id="picMsg" style="text-align:center;color:#4cb8b9;display:none;margin:0 0 12px;font-size:0.9rem;"></p>

            <label>Name</label>
            <input type="text" id="name" placeholder="Full name">

            <label>Birthday</label>
            <input type="date" id="birthday">

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="(316) 555-1234">

            <label>Email</label>
            <input type="email" id="email" disabled>

            <label>Address</label>
            <textarea id="address" rows="3" placeholder="Street, City, State, ZIP"></textarea>

            <label>Appearance</label>
            <div class="theme-toggle" role="group" aria-label="Theme">
                <button type="button" id="themeLight" onclick="chooseTheme('light')">☀️ Light</button>
                <button type="button" id="themeDark" onclick="chooseTheme('dark')">🌙 Dark</button>
            </div>

            <label>Music Groups</label>
            <div id="musicGroupsBox" class="info-box">Loading…</div>

            <label>Songs (from groups & solos)</label>
            <div id="songsBox" class="info-box">Loading…</div>

            <button class="menu-btn" onclick="saveProfile()">Save Changes</button>
            <p id="saveMsg" style="color:#4cb8b9; text-align:center; display:none;">Saved!</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('navDrawer').classList.toggle('open');
            document.getElementById('navOverlay').classList.toggle('open');
        }

        const storage = firebase.storage();
        let currentProfile = null;
        const MAX_PIC_MB = 15;

        function syncThemeButtons() {
            var t = (typeof getAppTheme === 'function' ? getAppTheme() : 'light');
            document.getElementById('themeLight').classList.toggle('active', t === 'light');
            document.getElementById('themeDark').classList.toggle('active', t === 'dark');
        }

        async function chooseTheme(t) {
            if (typeof setAppTheme === 'function') setAppTheme(t);
            syncThemeButtons();
            var user = auth.currentUser;
            if (user) {
                try {
                    await db.collection('users').doc(user.uid).set({ theme: t }, { merge: true });
                } catch (e) { console.warn(e); }
            }
        }

        function showPic(url) {
            const img = document.getElementById('picImg');
            const ph = document.getElementById('picPlaceholder');
            if (url) {
                img.src = url;
                img.style.display = 'block';
                ph.style.display = 'none';
            } else {
                img.style.display = 'none';
                img.removeAttribute('src');
                ph.style.display = 'flex';
            }
        }

        function showPicMsg(text, isError) {
            const el = document.getElementById('picMsg');
            el.textContent = text;
            el.style.color = isError ? '#c62828' : '#4cb8b9';
            el.style.display = 'block';
            setTimeout(function () { el.style.display = 'none'; }, 4000);
        }

        function compressImage(file) {
            return new Promise(function (resolve, reject) {
                if (!file.type || !file.type.startsWith('image/')) {
                    reject(new Error('Please choose an image file.'));
                    return;
                }
                const reader = new FileReader();
                reader.onerror = function () { reject(new Error('Could not read that photo.')); };
                reader.onload = function () {
                    const img = new Image();
                    img.onerror = function () { reject(new Error('Could not load that photo.')); };
                    img.onload = function () {
                        const maxSide = 1200;
                        let w = img.width;
                        let h = img.height;
                        if (w > maxSide || h > maxSide) {
                            if (w >= h) {
                                h = Math.round(h * (maxSide / w));
                                w = maxSide;
                            } else {
                                w = Math.round(w * (maxSide / h));
                                h = maxSide;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        canvas.toBlob(function (blob) {
                            if (!blob) {
                                reject(new Error('Could not process that photo.'));
                                return;
                            }
                            resolve(new File([blob], 'avatar.jpg', { type: 'image/jpeg' }));
                        }, 'image/jpeg', 0.85);
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        auth.onAuthStateChanged(async function(user) {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentProfile = await ensureUserProfile(user);
            if (currentProfile) {
                document.getElementById('name').value = currentProfile.name || '';
                document.getElementById('birthday').value = currentProfile.birthday || '';
                document.getElementById('phone').value = currentProfile.phone || '';
                document.getElementById('email').value = currentProfile.email || '';
                document.getElementById('address').value = currentProfile.address || '';
                showPic(currentProfile.photoURL || '');
                if (currentProfile.theme && typeof setAppTheme === 'function') {
                    setAppTheme(currentProfile.theme);
                }
                syncThemeButtons();
                loadMusicInfo(currentProfile, user.uid);
            }
        });

        document.getElementById('picLibrary').addEventListener('change', function () {
            if (this.files && this.files[0]) uploadProfilePic(this.files[0]);
            this.value = '';
        });
        document.getElementById('picCamera').addEventListener('change', function () {
            if (this.files && this.files[0]) uploadProfilePic(this.files[0]);
            this.value = '';
        });

        async function uploadProfilePic(file) {
            const user = auth.currentUser;
            if (!user || !file) return;

            const progress = document.getElementById('picProgress');
            const bar = document.getElementById('picBar');
            const text = document.getElementById('picProgressText');
            progress.style.display = 'block';
            bar.style.width = '0%';
            text.textContent = 'Preparing photo…';

            try {
                let uploadFile = file;
                try {
                    text.textContent = 'Resizing photo…';
                    uploadFile = await compressImage(file);
                } catch (compressErr) {
                    if (file.size > MAX_PIC_MB * 1024 * 1024) {
                        throw compressErr;
                    }
                    uploadFile = file;
                }

                if (uploadFile.size > MAX_PIC_MB * 1024 * 1024) {
                    showPicMsg('Image is still too large after resize. Try a smaller photo.', true);
                    return;
                }

                text.textContent = 'Uploading…';
                const path = 'profile-pics/' + user.uid + '/avatar.jpg';
                const ref = storage.ref(path);
                const task = ref.put(uploadFile, {
                    contentType: uploadFile.type || 'image/jpeg',
                    customMetadata: { uploadedBy: user.uid }
                });

                await new Promise(function (resolve, reject) {
                    task.on('state_changed',
                        function (snap) {
                            if (snap.totalBytes) {
                                bar.style.width = Math.round((snap.bytesTransferred / snap.totalBytes) * 100) + '%';
                            }
                        },
                        function (err) { reject(err); },
                        function () { resolve(); }
                    );
                });

                const url = await task.snapshot.ref.getDownloadURL();
                await db.collection('users').doc(user.uid).set({
                    photoURL: url,
                    photoPath: path,
                    photoUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                if (currentProfile) {
                    currentProfile.photoURL = url;
                    currentProfile.photoPath = path;
                }
                showPic(url + '?t=' + Date.now());
                showPicMsg('Profile picture updated!');
            } catch (err) {
                console.error(err);
                var msg = (err && err.message) || 'Upload failed.';
                if (String(msg).toLowerCase().indexOf('permission') !== -1 || (err && err.code === 'storage/unauthorized')) {
                    msg = 'Permission denied. Update Firebase Storage rules for profile-pics.';
                }
                showPicMsg(msg, true);
            } finally {
                progress.style.display = 'none';
                bar.style.width = '0%';
            }
        }

        async function loadMusicInfo(profile, uid) {
            const gBox = document.getElementById('musicGroupsBox');
            const sBox = document.getElementById('songsBox');
            if (!gBox) return;
            const names = profile.musicGroupNames || [];
            gBox.textContent = names.length ? names.join(', ') : 'None yet';
            let songs = Array.isArray(profile.songs) ? profile.songs.slice() : [];
            try {
                const snap = await db.collection('musicGroups').where('memberUids', 'array-contains', uid).get();
                const gNames = [];
                snap.forEach(doc => {
                    const g = doc.data();
                    if (g.name) gNames.push(g.name);
                    (g.songs || []).forEach(s => { if (s && !songs.includes(s)) songs.push(s); });
                });
                if (gNames.length) gBox.textContent = gNames.join(', ');
            } catch (e) { console.warn(e); }
            sBox.textContent = songs.length ? songs.join(', ') : 'None yet';
        }

        async function saveProfile() {
            const user = auth.currentUser;
            if (!user) return;

            const updates = {
                name: document.getElementById('name').value.trim(),
                birthday: document.getElementById('birthday').value,
                phone: document.getElementById('phone').value.trim(),
                address: document.getElementById('address').value.trim(),
                theme: (typeof getAppTheme === 'function' ? getAppTheme() : 'light')
            };

            await db.collection('users').doc(user.uid).update(updates);
            const msg = document.getElementById('saveMsg');
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 2000);
        }

        syncThemeButtons();
    </script>
</body>
</html>
